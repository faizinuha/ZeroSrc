<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ZeroMix Search</title>
    <link rel="stylesheet" href="searchbar.css" />
    <link rel="icon" href="image.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="ZeroMix" />
    <meta name="description" content="ZeroMix Search Bar Extension" />
    <meta name="keywords" content="search, extension, ZeroMix" />
    <meta name="theme-color" content="#115ab3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <style>
      /* Tambahkan gaya CSS tambahan di sini jika diperlukan */
    </style>
  </head>
  <body class="gemini-disabled">
    <div class="container">
      <!-- Area untuk menampilkan respons dari AI -->
      <div id="response-container" class="response-container">
        <div class="placeholder-text">
          <span id="placeholder-icon" class="gemini-icon">✧</span>
          <p>Halo! Mau cari apa atau tanya apa hari ini? 🤔</p>
          <p style="font-size: 14px; color: #9aa0a6">
            Tekan 'Tab' untuk beralih mode (Google, Gemini Teks, Gemini Gambar).
          </p>
          <p>
              <p style="font-size: 13px; color: #9aa0a6">
              API Key disimpan aman di perangkatmu. ✅
            </p>
            <p>Perlu DI Ingat Tidak Ada Riwayat Chat!!</p>
          </p>
        </div>
      </div>

      <!-- Area untuk pratinjau file yang diunggah -->
      <div id="file-preview-container" class="file-preview-container"></div>

      <!-- Area input di bagian bawah -->
      <div class="search-box">
        <div id="mode-indicator" class="mode-google">G</div>
        <button id="attach-file-button" class="attach-button">📎</button>
        <input
          type="file"
          id="fileInput"
          style="display: none"
          accept="image/*,audio/*,video/*,.pdf,.txt,.json,.md"
        />
        <input
          type="text"
          id="searchInput"
          placeholder="Cari di Google..."
          autofocus
        />

        <button
          id="stop-generation-button"
          class="stop-button"
          style="display: none"
        >
          ■
        </button>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>

    <!-- Overlay untuk memasukkan API Key -->
    <div id="api-key-overlay" class="api-key-overlay">
      <div id="gemini-api-modal" class="api-key-modal">
        <h3>Set Gemini API Key</h3>
        <p>
          Dapatkan API Key Anda dari<a
            href="https://aistudio.google.com/app/apikey"
            target="_blank"
          >
            Google AI Studio</a
          >.
        </p>
        <input
          type="password"
          id="apiKeyInput"
          placeholder="Masukkan API Key Anda di sini"
        />
        <button id="saveApiKeyButton">Simpan & Coba Lagi</button>
        <button
          id="changeApiKeyButton"
          class="secondary-button"
          style="display: none"
        >
          Ganti API Key
        </button>
      </div>
    </div>
    <script src="searchbar.js"></script>
  </body>
</html>
