<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ZeroMix Search</title>
    <link rel="stylesheet" href="searchbar.css" />
    <link rel="icon" href="image.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="ZeroMix" />
    <meta name="description" content="ZeroMix Search Bar Extension" />
    <meta name="keywords" content="search, extension, ZeroMix" />
    <meta name="theme-color" content="#115ab3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <style>
      /* Tambahkan gaya CSS tambahan di sini jika diperlukan */
    </style>
  </head>
  <body>
    <div class="overlay">
      <!-- <img src="image.png" class="img" alt="ZeroMix" copyright="ZeroMix" /> -->
      <span class="logo-text"> | </span>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Silakan ketik untuk mencari..."
          autofocus
        />
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
    <script src="searchbar.js"></script>
  </body>
</html>
