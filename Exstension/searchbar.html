<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ZeroMix Search</title>
    <link rel="stylesheet" href="searchbar.css" />
    <link rel="icon" href="image.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="ZeroMix" />
    <meta name="description" content="ZeroMix Search Bar Extension" />
    <meta name="keywords" content="search, extension, ZeroMix" />
    <meta name="theme-color" content="#115ab3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <div class="main-wrapper">
      <!-- Sidebar untuk Riwayat -->
      <div id="history-sidebar" class="history-sidebar">
        <div id="history-content">
          <!-- Konten riwayat akan diisi oleh JavaScript -->
        </div>
        <button id="history-toggle-btn" title="Buka/Tutup Riwayat">›</button>
      </div>

      <!-- Kontainer Utama -->
      <div class="container">
        <!-- Area untuk menampilkan konten utama (placeholder) -->
        <div id="response-container" class="response-container">
          <div class="placeholder-text">
            <span id="placeholder-icon" class="gemini-icon">✧</span>
            <p>Halo! Mau cari apa atau tanya apa hari ini? 🤔</p>
            <p style="font-size: 14px; color: #9aa0a6">
              Gunakan search bar di bawah atau buka riwayat di samping.
            </p>
            <p>
              <p style="font-size: 13px; color: #9aa0a6">
                Ekstensi ini fokus pada pencarian cepat. ✅
              </p>
              <p>Selamat Mencoba!!</p>
            </p>
          </div>
        </div>

        <!-- Area input di bagian bawah -->
        <div class="search-box">
          <div id="mode-indicator" class="mode-google">G</div>
          <input
            type="text"
            id="searchInput"
            placeholder="Cari di Google atau dalam riwayat..."
            autofocus
          />
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>
    </div>
    <script src="searchbar.js"></script>
  </body>
</html>
