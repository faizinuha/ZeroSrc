<!DOCTYPE html>
<html>
<head>
  <title>ZeroMix Shortcut</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="image.png" alt="ZeroMix Icon" class="icon">
      <h1>ZeroMix</h1>
    </div>
    <p class="description">Quick productivity with custom shortcuts</p>

    <div class="shortcut-section">
      <label for="currentShortcut">Active Shortcut:</label>
      <div id="currentShortcut" class="shortcut-display">Control + Backslash</div>
      <button id="changeShortcut" class="btn primary">Change Shortcut</button>
    </div>

    <div id="recorder" class="recorder-section hidden">
      <div id="recordedKeys" class="recorded-keys">Press key combination...</div>
      <div class="button-group">
        <button id="saveShortcut" class="btn success">Save</button>
        <button id="cancelShortcut" class="btn danger">Cancel</button>
      </div>
    </div>

    <button id="advancedBtn" class="btn secondary">Advanced</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
