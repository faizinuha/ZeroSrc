<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Live2D Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #canvas {
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #ff69b4;
        font-family: "Segoe UI", sans-serif;
      }
      #loading .emoji {
        font-size: 48px;
        margin-bottom: 10px;
      }
      #loading .text {
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="emoji">🎭</div>
      <div class="text">Loading Live2D...</div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- PIXI.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <!-- Live2D Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <script>
      // Configuration
      let MODEL_PATH = "Sou Sou No Frieren/Frieren/Frieren.model3.json";

      // Global state
      let app = null;
      let model = null;
      let targetEyeX = 0,
        targetEyeY = 0;
      let currentEyeX = 0,
        currentEyeY = 0;
      let isModelLoaded = false;

      // Initialize
      async function init() {
        const canvas = document.getElementById("canvas");
        const loading = document.getElementById("loading");

        // Check for model path in URL
        const urlParams = new URLSearchParams(window.location.search);
        const modelParam = urlParams.get("model");
        if (modelParam) MODEL_PATH = modelParam;

        try {
          app = new PIXI.Application({
            view: canvas,
            backgroundAlpha: 0,
            resizeTo: window,
            antialias: true,
          });

          // Performance Optimization: Limit FPS
          app.ticker.maxFPS = 60;

          await loadModel(MODEL_PATH);

          // Start update loop
          app.ticker.add(updateLoop);
          console.log("[Live2D] Initialized");
        } catch (error) {
          console.error("[Live2D] Init error:", error);
          showError();
        }
      }

      async function loadModel(path) {
        const loading = document.getElementById("loading");
        loading.style.display = "block";
        loading.querySelector(".text").textContent = "Loading model...";

        isModelLoaded = false;
        if (model) {
          app.stage.removeChild(model);
          model.destroy();
        }

        try {
          model = await PIXI.live2d.Live2DModel.from(path, {
            autoInteract: true,
            autoUpdate: true,
          });

          model.anchor.set(0.5, 1);

          // AUTO SCALE: Calculate scale to fit window height (with 20px padding)
          const targetHeight = app.screen.height - 40;
          const currentHeight = model.height;
          const autoScale = (targetHeight / currentHeight) * model.scale.x;
          model.scale.set(autoScale);

          model.x = app.screen.width / 2;
          model.y = app.screen.height;

          app.stage.addChild(model);
          loading.style.display = "none";
          isModelLoaded = true;

          // Try to hide watermark parts if found
          try {
            const parts = model.internalModel.coreModel._partIds;
            parts.forEach((id, index) => {
              if (
                id.toLowerCase().includes("illust") ||
                id.toLowerCase().includes("text")
              ) {
                model.internalModel.coreModel.setPartOpacityByIndex(index, 0);
              }
            });
          } catch (e) {}

          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: "model_loaded" });
          }

          model.on("pointerdown", onModelClick);
          model.interactive = true;
          model.cursor = "pointer";

          // Re-adjust on next frame to be sure
          setTimeout(() => {
            const finalRatio = (app.screen.height - 40) / model.height;
            model.scale.set(model.scale.x * finalRatio);
            model.y = app.screen.height;
          }, 100);
        } catch (e) {
          console.error("[Live2D] Load error:", e);
          showError();
        }
      }

      function showError() {
        const loading = document.getElementById("loading");
        loading.style.display = "block";
        loading.querySelector(".emoji").textContent = "😢";
        loading.querySelector(".text").textContent =
          "Model tidak ditemukan atau rusak";
      }

      async function changeModel(path) {
        console.log("[Live2D] Changing model to:", path);
        await loadModel(path);
      }

      // Dragging support from JS to WPF
      let isDragging = false;
      let startX, startY;

      window.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.screenX;
        startY = e.screenY;
      });

      window.addEventListener("mousemove", (e) => {
        if (isDragging && window.chrome && window.chrome.webview) {
          const deltaX = e.screenX - startX;
          const deltaY = e.screenY - startY;

          if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
            window.chrome.webview.postMessage({
              type: "drag",
              deltaX: deltaX,
              deltaY: deltaY,
            });
            startX = e.screenX;
            startY = e.screenY;
          }
        }
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      function onModelClick() {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: "click" });
        }

        playSpecialMotion();
      }

      function playSpecialMotion() {
        if (!model || !model.internalModel) return;

        try {
          let expressions = [];

          if (MODEL_PATH.toLowerCase().includes("frieren")) {
            // Frieren specific
            expressions = [
              "anya",
              "anya2",
              "yy",
              "ku",
              "han",
              "mmy",
              "d",
              "lks",
              "wh",
              "zx",
              "W",
              "erd",
            ];
            model.motion(""); // Play random motion from default group
          } else if (MODEL_PATH.toLowerCase().includes("fern")) {
            // Fern specific
            expressions = ["lh", "sq", "sy"];
            model.motion("");
          } else if (MODEL_PATH.toLowerCase().includes("huohuo")) {
            // Huohuo specific
            expressions = [
              "angry",
              "baozhen",
              "cry",
              "qizi1",
              "qizi2",
              "white eyes",
            ];
            // Huohuo motions are also under default group "" in our JSON
            model.motion("");
          }

          if (expressions.length > 0) {
            const randomExp =
              expressions[Math.floor(Math.random() * expressions.length)];
            model.expression(randomExp);
            console.log("[Live2D] Playing expression:", randomExp);
          }
        } catch (e) {
          console.error("[Live2D] Error playing motion:", e);
        }
      }

      function updateEyeTracking(x, y) {
        targetEyeX = x;
        targetEyeY = y;
      }

      function updateLoop() {
        if (!isModelLoaded || !model || !model.internalModel) return;

        currentEyeX += (targetEyeX - currentEyeX) * 0.1;
        currentEyeY += (targetEyeY - currentEyeY) * 0.1;

        const coreModel = model.internalModel.coreModel;
        if (!coreModel) return;

        try {
          // Support multiple parameter naming conventions
          const paramMap = {
            ParamEyeBallX: currentEyeX,
            ParamEyeBallY: -currentEyeY,
            ParamAngleX: currentEyeX * 15,
            ParamAngleY: currentEyeY * 10,
            ParamBodyAngleX: currentEyeX * 5,
            ParamEyeBallX01: currentEyeX,
            ParamEyeBallY01: -currentEyeY,
            ParamEyeX: currentEyeX,
            ParamEyeY: -currentEyeY,
          };

          for (const [key, val] of Object.entries(paramMap)) {
            const index = coreModel.getParameterIndex(key);
            if (index >= 0) coreModel.setParameterValueByIndex(index, val);
          }
        } catch (e) {}
      }

      window.addEventListener("resize", () => {
        if (app && model) {
          model.x = app.screen.width / 2;
          model.y = app.screen.height;
        }
      });

      // Start
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
