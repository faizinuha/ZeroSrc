name: 🚀 Build & Release ZeroMix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # - name: 🛠️ Setup Build Tools (Make)
    #   shell: pwsh
    #   run: |
    #     choco install make

    - name: 📦 Restore & Publish
      shell: pwsh
      run: |
        dotnet restore ZeroMix.csproj
        # Build using Makefile (it handles publish and EXE installer)
        make all VERSION=${{ github.ref_name }}
      continue-on-error: true

    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ZeroMix-v${{ github.ref_name }}
        path: Exe/*.exe

    - name: 🌟 Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Exe/*.exe
        body: "Automated Release for ZeroMix v${{ github.ref_name }}\n\nFormat tersedia: Standard EXE Setup."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
