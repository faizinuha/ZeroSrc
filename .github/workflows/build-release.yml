name: 🚀 Build & Release ZeroMix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔖 Determine Version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event.inputs.version }}" -ne "") {
          # Remove any leading 'v's from input version
          $inputVersion = "${{ github.event.inputs.version }}" -replace '^v+', ''
          $tag = "v$inputVersion"
        } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
        } else {
          Write-Error "Invalid GitHub ref for versioning: $env:GITHUB_REF. this workflow only supports tag-based invocation or explicit version input."
          exit 1
        }

        # Ensure tag starts with 'v' and remove any extra 'v's
        $tag = $tag -replace '^v+', 'v'

        if (-not ($tag -match '^v[0-9]+(\.[0-9]+){2,3}$')) {
          Write-Error "Derived tag '$tag' is not a valid semantic version tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.BUILD)."
          exit 1
        }

        $version = $tag -replace '^v', ''
        echo "tag=$tag" >> $env:GITHUB_OUTPUT
        echo "version=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Building version: $version"

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 📦 Restore NuGet Packages
      shell: pwsh
      run: |
        dotnet restore ZeroMix.csproj
        Write-Host "✅ Packages restored"

    - name: 🔨 Build ZeroMix
      shell: pwsh
      run: |
        # First restore packages
        dotnet restore ZeroMix.csproj
        
        # Build in Release mode
        dotnet build ZeroMix.csproj `
          -c Release `
          -p:Version=${{ steps.version.outputs.version }} `
          -p:InformationalVersion=${{ steps.version.outputs.tag }}
        Write-Host "✅ Build completed"

    - name: 📦 Publish Release Build
      shell: pwsh
      run: |
        # Create publish directory structure expected by Inno Setup
        if (-not (Test-Path "./publish/win-x64")) {
          New-Item -ItemType Directory -Path "./publish/win-x64" -Force | Out-Null
        }
        
        dotnet publish ZeroMix.csproj `
          -c Release `
          -o ./publish/win-x64 `
          -p:Version=${{ steps.version.outputs.version }}
        Write-Host "✅ Publish completed to ./publish/win-x64"
        
        # Copy additional assets required by the application
        Write-Host "📋 Copying additional assets..."
        
        # Copy Virtual_Assisten folder (Live2D models and assets)
        if (Test-Path "./Virtual_Assisten") {
          Copy-Item "./Virtual_Assisten" "./publish/win-x64/Virtual_Assisten" -Recurse -Force
          Write-Host "✅ Virtual_Assisten copied"
        }
        
        # Copy Resource folder if not already included
        if (Test-Path "./Resource") {
          Copy-Item "./Resource" "./publish/win-x64/Resource" -Recurse -Force
          Write-Host "✅ Resource folder copied"
        }
        
        # Copy Plugins folder if not already included
        if (Test-Path "./Plugins") {
          Copy-Item "./Plugins" "./publish/win-x64/Plugins" -Recurse -Force
          Write-Host "✅ Plugins folder copied"
        }
        
        # Create Exe directory if not exists
        if (-not (Test-Path "./Exe")) {
          New-Item -ItemType Directory -Path "./Exe" | Out-Null
        }
        
        # Copy published files to Exe directory for release
        if (Test-Path "./publish/win-x64/ZeroMix.exe") {
          Copy-Item "./publish/win-x64/ZeroMix.exe" "./Exe/ZeroMix-${{ steps.version.outputs.tag }}.exe"
          Write-Host "✅ Executable copied to Exe folder"
        }
        
        # Also copy to root for easier access
        if (Test-Path "./publish/win-x64/ZeroMix.exe") {
          Copy-Item "./publish/win-x64/ZeroMix.exe" "./ZeroMix-${{ steps.version.outputs.tag }}.exe"
          Write-Host "✅ Executable copied to root"
        }

    - name: 📥 Download FFMPEG
      shell: pwsh
      run: |
        # Create FFMPEG directory
        if (-not (Test-Path "./FFMPEG")) {
          New-Item -ItemType Directory -Path "./FFMPEG" -Force | Out-Null
        }
        
        # Download latest FFMPEG static build for Windows
        Write-Host "📥 Downloading FFMPEG..."
        $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        $zipPath = "./ffmpeg-temp.zip"
        
        try {
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath
          Write-Host "✅ FFMPEG downloaded"
          
          # Extract ffmpeg.exe from zip
          Expand-Archive -Path $zipPath -DestinationPath "./ffmpeg-temp" -Force
          
          # Find ffmpeg.exe in extracted files
          $ffmpegExe = Get-ChildItem -Path "./ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          
          if ($ffmpegExe) {
            Copy-Item $ffmpegExe.FullName "./FFMPEG/ffmpeg.exe"
            Write-Host "✅ FFMPEG extracted to ./FFMPEG/ffmpeg.exe"
          } else {
            Write-Host "⚠️  FFMPEG.exe not found in downloaded archive"
          }
          
          # Cleanup
          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          Remove-Item "./ffmpeg-temp" -Recurse -Force -ErrorAction SilentlyContinue
          
        } catch {
          Write-Host "⚠️  Failed to download FFMPEG: $($_.Exception.Message)"
          Write-Host "ℹ️  MSI build will fail, but portable EXE will still work"
        }

    - name: 🧩 Build MSI Installer (Inno Setup)
      shell: pwsh
      run: |
        # Download Inno Setup if not installed
        Write-Host "📥 Checking Inno Setup..."
        $InnoSetupPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        
        if (-not (Test-Path $InnoSetupPath)) {
          Write-Host "ℹ️  Inno Setup not found, attempting to install via Chocolatey..."
          choco install innosetup -y
        }
        
        # Build MSI
        Write-Host "🏗️  Building MSI installer..."
        $InnoSetupPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        
        if (Test-Path $InnoSetupPath) {
          & $InnoSetupPath /F"ZeroMix-${{ steps.version.outputs.tag }}-Setup" "./Exe/Setup.iss"
          
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ MSI installer created successfully"
            
            # Verify MSI was created
            if (Test-Path "./Exe/ZeroMix-${{ steps.version.outputs.tag }}-Setup.exe") {
              Write-Host "✅ MSI file ready: ZeroMix-${{ steps.version.outputs.tag }}-Setup.exe"
            }
          } else {
            Write-Host "⚠️  MSI build failed with exit code: $LASTEXITCODE"
          }
        } else {
          Write-Host "⚠️  Inno Setup not available, skipping MSI build"
        }

    - name: 🔐 Code Signing
      shell: pwsh
      run: |
        Write-Host "🔐 Setting up code signing..."
        
        # Download osslsigncode if not available
        $SignTool = "./osslsigncode.exe"
        if (-not (Test-Path $SignTool)) {
          Write-Host "📥 Downloading osslsigncode..."
          Invoke-WebRequest -Uri "https://github.com/mtrojnar/osslsigncode/releases/download/2.8/osslsigncode-2.8-win64.zip" -OutFile "osslsigncode.zip"
          Expand-Archive -Path "osslsigncode.zip" -DestinationPath "." -Force
          Copy-Item "osslsigncode-2.8-win64/osslsigncode.exe" $SignTool
          Remove-Item "osslsigncode.zip", "osslsigncode-2.8-win64" -Recurse -Force
        }
        
        # Sign main executable
        $ExePath = "./publish/win-x64/ZeroMix.exe"
        if (Test-Path $ExePath) {
          Write-Host "🔐 Signing main executable..."
          & $SignTool sign -pkcs12 "./Exe/ZeroMixCert.pfx" -pass "ZeroMixPass" -n "ZeroMix" -i "https://zeromix.pages.dev" -t "http://timestamp.digicert.com" -in $ExePath -out "$ExePath.signed"
          if ($LASTEXITCODE -eq 0) {
            Move-Item "$ExePath.signed" $ExePath -Force
            Write-Host "✅ Executable signed successfully"
          } else {
            Write-Host "⚠️  Failed to sign executable"
          }
        }
        
        # Sign installer
        $InstallerPath = "./Exe/ZeroMix-${{ steps.version.outputs.tag }}-Setup.exe"
        if (Test-Path $InstallerPath) {
          Write-Host "🔐 Signing installer..."
          & $SignTool sign -pkcs12 "./Exe/ZeroMixCert.pfx" -pass "ZeroMixPass" -n "ZeroMix" -i "https://zeromix.pages.dev" -t "http://timestamp.digicert.com" -in $InstallerPath -out "$InstallerPath.signed"
          if ($LASTEXITCODE -eq 0) {
            Move-Item "$InstallerPath.signed" $InstallerPath -Force
            Write-Host "✅ Installer signed successfully"
          } else {
            Write-Host "⚠️  Failed to sign installer"
          }
        }

    - name: 📝 Generate Changelog
      id: changelog
      continue-on-error: true
      shell: bash
      run: |
        TAG="${{ steps.version.outputs.tag }}"
        PREV_TAG=$(git tag -l 'v*' --sort=-version:refname 2>/dev/null | head -2 | tail -1)
        
        if [ -z "$PREV_TAG" ]; then
          COMMIT_RANGE="--all"
        else
          COMMIT_RANGE="$PREV_TAG..$TAG"
        fi
        
        > /tmp/changelog.md
        
        # Features
        FEATURES=$(git log $COMMIT_RANGE --oneline --grep="feat" --grep="feature" --all-match --pretty=format:"- %s" 2>/dev/null | sort | uniq | head -20)
        if [ -n "$FEATURES" ]; then
          echo "### ✨ Features" >> /tmp/changelog.md
          echo "$FEATURES" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
        fi
        
        # Bug Fixes
        FIXES=$(git log $COMMIT_RANGE --oneline --grep="fix\|bug" --all-match --pretty=format:"- %s" 2>/dev/null | sort | uniq | head -20)
        if [ -n "$FIXES" ]; then
          echo "### 🐛 Bug Fixes" >> /tmp/changelog.md
          echo "$FIXES" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
        fi
        
        # Improvements
        IMPROVEMENTS=$(git log $COMMIT_RANGE --oneline --grep="improve\|refactor\|perf" --all-match --pretty=format:"- %s" 2>/dev/null | sort | uniq | head -10)
        if [ -n "$IMPROVEMENTS" ]; then
          echo "### 🚀 Improvements" >> /tmp/changelog.md
          echo "$IMPROVEMENTS" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
        fi
        
        if [ ! -s /tmp/changelog.md ]; then
          echo "### 📝 Updates" >> /tmp/changelog.md
          echo "- Bug fixes and improvements" >> /tmp/changelog.md
        fi
        
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        cat /tmp/changelog.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: 📦 Create GitHub Release with Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "🎉 ZeroMix ${{ steps.version.outputs.tag }}"
        files: |
          ZeroMix-${{ steps.version.outputs.tag }}.exe
          Exe/ZeroMix-${{ steps.version.outputs.tag }}.exe
          Exe/ZeroMix-${{ steps.version.outputs.tag }}-Setup.exe
        body: |
          # 🎉 ZeroMix Release ${{ steps.version.outputs.tag }}
          
          **Version:** v${{ steps.version.outputs.version }}  
          **Status:** ✅ Production Release  
          
          ---
          
          ## 📋 What's Changed
          
          ${{ env.CHANGELOG }}
          
          ---
          
          ## 📥 Download Options
          
          Choose your preferred installation method:
          
          ### 🔹 **Portable** (Recommended for testing)
          - Download: `ZeroMix-${{ steps.version.outputs.tag }}.exe`
          - Just run, no installation needed
          
          ### 🔹 **Installer** (Recommended for regular use)
          - Download: `ZeroMix-${{ steps.version.outputs.tag }}-Setup.exe`
          - Professional MSI installer
          - Adds to Start Menu, Add/Remove Programs
          - One-click uninstall support
          
          All files available in **Assets** section below ⬇️
          
          ---
          
          ## 🖥️ System Requirements
          
          - **Windows:** 10/11 (64-bit)
          - **.NET Runtime:** 9.0 or later
          - **GPU:** DirectX 12 compatible
          - **RAM:** 2GB minimum (4GB+ recommended)
          
          ## 🔗 Links
          
          - 📚 [Documentation](https://github.com/faizinuha/ZeroMix/wiki)
          - 🐛 [Report Issues](https://github.com/faizinuha/ZeroMix/issues)
          - 💬 [Discussions](https://github.com/faizinuha/ZeroMix/discussions)  
          - 📖 [Full Changelog](https://github.com/faizinuha/ZeroMix/blob/ProyekTil/CHANGELOG.md)
          
          ---
          
          ⭐ If you like ZeroMix, please consider giving us a star!
          
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: ✅ Build & Release Complete
      run: |
        Write-Host "=================================================="
        Write-Host "✅ Build & Release Successful!"
        Write-Host "=================================================="
        Write-Host "Version: ${{ steps.version.outputs.tag }}"
        Write-Host "GitHub Release: https://github.com/faizinuha/ZeroMix/releases/tag/${{ steps.version.outputs.tag }}"
        Write-Host "=================================================="

