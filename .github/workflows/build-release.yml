name: 🚀 Build & Release ZeroMix

on:
  push:
    tags:
      - 'v*' # Trigger saat push tag versi (misal v4.8.0)
  workflow_dispatch: # Memungkinkan jalankan manual dari web GitHub

jobs:
  build:
    runs-on: windows-latest # Pakai Windows karena butuh Inno Setup & .NET Desktop

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 🛠️ Install WiX Toolset v4
      run: |
        dotnet tool install --global wix
        # Tambahkan extension yang dibutuhkan (opsional, tapi bagus untuk UI)
        wix extension add WixToolset.UI.wixext --global

    - name: 📦 Restore Dependencies
      run: dotnet restore ZeroMix.csproj

    - name: 🔨 Publish Application (Release Mode)
      run: dotnet publish ZeroMix.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
      # Catatan: Karena di .csproj ada target "Obfuscate" setelah build, 
      # Obfuscar akan otomatis jalan saat proses ini.

    - name: 🏗️ Build All Installers (EXE, MSI, MSIX)
      shell: pwsh
      run: |
        # Menggunakan Makefile yang sudah kita update
        # Pastikan PATH untuk WiX dan SignTool sudah benar
        make all VERSION=${{ github.ref_name }}
      continue-on-error: true # Biarkan lanjut jika salah satu gagal (untuk testing)

    - name: 📤 Upload All Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ZeroMix-Packages-v${{ github.ref_name }}
        path: |
          Exe/*.exe
          Exe/*.msi
          Exe/*.msix

    - name: 🌟 Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Exe/*.exe
          Exe/*.msi
          Exe/*.msix
        body: "Automated Release for ZeroMix v${{ github.ref_name }}\n\nFormat tersedia: Standard EXE, MSI (Corporate), MSIX (Modern)."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
