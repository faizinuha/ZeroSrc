name: 🚀 Build & Release ZeroMix

on:
  push:
    branches:
      - ProyekTil
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 📌 Determine & Create Version Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            INPUT_VER=${INPUT_VER#v}
            TAG="v$INPUT_VER"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=$INPUT_VER" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "📄 Commit message: $COMMIT_MSG"
          
          LAST_TAG=$(git tag -l 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+(\.[0-9]+){2,3}$' | head -1)
          if [ -z "$LAST_TAG" ]; then LAST_TAG="v0.0.0.0"; fi
          echo "📍 Last version tag: $LAST_TAG"
          
          LAST_VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$LAST_VERSION"
          if [ -z "$MAJOR" ]; then MAJOR=0; fi
          if [ -z "$MINOR" ]; then MINOR=0; fi
          if [ -z "$PATCH" ]; then PATCH=0; fi
          if [ -z "$BUILD" ]; then BUILD=0; fi
          
          if [[ $COMMIT_MSG =~ ^fix: ]]; then
            if [ "$BUILD" -ne 0 ]; then
              NEW_VERSION="$MAJOR.$MINOR.$PATCH.$((BUILD+1))"
            else
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
            fi
            BUMP=true
          elif [[ $COMMIT_MSG =~ ^feat: ]]; then
            if [ "$BUILD" -ne 0 ]; then
              NEW_VERSION="$MAJOR.$((MINOR+1)).0.0"
            else
              NEW_VERSION="$MAJOR.$((MINOR+1)).0"
            fi
            BUMP=true
          elif [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]]; then
            NEW_VERSION="$((MAJOR+1)).0.0.0"
            BUMP=true
          else
            echo "⏭️  No version bump needed"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          TAG="v$NEW_VERSION"
          echo "✅ New version: $TAG"
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git tag -a "$TAG" -m "Release $TAG: $COMMIT_MSG"
          git push origin "$TAG"
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

  build-and-release:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 📦 Install dependencies
      run: dotnet restore ZeroMix.csproj

    - name: 🔨 Build
      run: dotnet publish ZeroMix.csproj -c Release -o dist/ -p:Version=${{ needs.prepare.outputs.version }}

    - name: 📦 Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: dist/


