name: 🚀 Build & Release ZeroMix

# ─────────────────────────────────────────────────────────────────────────────
# KAPAN WORKFLOW INI JALAN?
#
# 1. Otomatis  → Saat kamu push tag seperti: git tag v5.2.0 && git push --tags
# 2. Manual    → Buka GitHub → Actions → klik "Run workflow" → isi versi
#
# CATATAN PENTING:
# - Push biasa (fix/feat ke main/dev) TIDAK akan trigger workflow ini
# - Hanya tag 'v*' yang trigger build + release otomatis
# - ZeroMix.Installer di-build setiap release agar URL download selalu update
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 5.2.0)'
        required: false

jobs:
  build:
    name: 🏗️ Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ─── STEP 1: Tentukan versi dari tag atau input manual ───────────────────
    - name: 🔢 Determine Version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          TAG="v${{ github.event.inputs.version }}"
        else
          TAG="${{ github.ref_name }}"
        fi
        VERSION=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "🚀 Building ZeroMix $TAG"

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # ─── STEP 2: Build project utama ZeroMix ────────────────────────────────
    - name: 📦 Restore & Publish ZeroMix
      shell: pwsh
      run: |
        $VER = "${{ steps.version.outputs.version }}" -replace '^v', ''
        Write-Host "⏳ Restoring dependencies..."
        dotnet restore ZeroMix.csproj

        # Update versi di Setup.iss agar installer versi sesuai tag
        $issContent = Get-Content "Exe/Setup.iss" -Raw
        $issContent = $issContent -replace '#define AppVersion "[\d\.]+"', "#define AppVersion `"$VER`""
        Set-Content "Exe/Setup.iss" $issContent -Encoding UTF8
        Write-Host "✅ Setup.iss version updated to $VER"

        Write-Host "⏳ Publishing application..."
        dotnet publish ZeroMix.csproj -c Release -o publish/win-x64 `
          -p:Version=$VER `
          -p:PublishSingleFile=false `
          -p:PublishReadyToRun=true `
          --self-contained true -r win-x64
        Write-Host "✅ Publish complete"

        # Pastikan folder Virtual_Assisten/VA_Thumbnails ada di output
        # (thumbnail mungkin tidak ada di CI karena model files tidak di-commit)
        $thumbDir = "publish/win-x64/Virtual_Assisten/VA_Thumbnails"
        if (!(Test-Path $thumbDir)) {
          New-Item -ItemType Directory -Force -Path $thumbDir | Out-Null
          Write-Host "📁 Created thumbnail directory: $thumbDir"
        }

    # ─── STEP 3: Download FFMPEG ────────────────────────────────────────────
    - name: 🎬 Download FFMPEG
      shell: pwsh
      run: |
        if (!(Test-Path "Tools/FFMPEG")) { New-Item -ItemType Directory -Force -Path "Tools/FFMPEG" }
        Write-Host "⏳ Downloading FFMPEG..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Write-Host "📦 Extracting FFMPEG..."
        Expand-Archive "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
        $binDir = Get-ChildItem -Path "ffmpeg_temp" -Filter "bin" -Recurse | Select-Object -First 1
        Copy-Item "$($binDir.FullName)\ffmpeg.exe" -Destination "Tools/FFMPEG/ffmpeg.exe" -Force
        Remove-Item "ffmpeg_temp" -Recurse -Force
        Remove-Item "ffmpeg.zip" -Force
        Write-Host "✅ FFMPEG ready"

    # ─── STEP 4: Build ZeroMix.Updater — HARUS sebelum Inno Setup ──────────
    - name: 🔧 Build ZeroMix.Updater (bundled)
      shell: pwsh
      run: |
        $VER = "${{ steps.version.outputs.version }}" -replace '^v', ''

        $csFile = "Tools/Updater/MainWindow.xaml.cs"
        $content = Get-Content $csFile -Raw
        $content = $content -replace 'private const string CurrentVer\s*=\s*"[\d\.]+"', "private const string CurrentVer  = `"$VER`""
        Set-Content $csFile $content -Encoding UTF8

        dotnet publish Tools/Updater/ZeroMix.Updater.csproj `
          -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          -p:Version=$VER `
          -o updater_output

        $exeSrc = "updater_output/ZeroMix-Updater.exe"
        $destDir = "publish/win-x64/Tools/Updater"
        if (Test-Path $exeSrc) {
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Copy-Item $exeSrc "$destDir/ZeroMix-Updater.exe" -Force
          Write-Host "✅ Updater bundled ($([math]::Round((Get-Item $exeSrc).Length / 1MB, 1)) MB) → $destDir"
        } else {
          Write-Host "⚠️  Updater build output tidak ditemukan"
        }

    # ─── STEP 5: Build Inno Setup installer ─────────────────────────────────
    - name: 🛠️ Build Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
      with:
        path: Exe/Setup.iss
        options: /DAppVersion=${{ steps.version.outputs.version }}

    # ─── STEP 5: Sign Setup.exe (skip jika tidak ada sertifikat) ────────────
    - name: 🔐 Sign Executable with osslsigncode
      shell: pwsh
      env:
        CERT_BASE64: ${{ secrets.CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      run: |
        $VER = "${{ steps.version.outputs.version }}"
        $setupExe = "Exe/ZeroMix-Setup-v$VER.exe"
        
        if (Test-Path $setupExe) {
          Write-Host "✅ Setup executable found: $setupExe"
          Write-Host "📝 File size: $([math]::Round((Get-Item $setupExe).Length / 1MB, 1)) MB"
          
          if ([string]::IsNullOrEmpty($env:CERT_BASE64)) {
            Write-Host "⚠️  Certificate not found in secrets, skipping signing"
            exit 0
          }
          
          Write-Host "⏳ Installing osslsigncode..."
          choco install osslsigncode -y --no-progress

          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          $osslBin = (Get-Command osslsigncode -ErrorAction SilentlyContinue)?.Source
          if ([string]::IsNullOrEmpty($osslBin)) {
            $osslBin = "C:\ProgramData\chocolatey\bin\osslsigncode.exe"
          }
          
          $certBytes = [Convert]::FromBase64String($env:CERT_BASE64)
          $certPath = "./cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          
          $signedPath = "Exe/ZeroMix-Setup-v$VER-signed.exe"
          & $osslBin sign -pkcs12 $certPath -pass "$env:CERT_PASSWORD" `
            -n "ZeroMix" -i "https://zeromix.vercel.app" `
            -t "http://timestamp.comodoca.com/authenticode" `
            -in $setupExe -out $signedPath
          
          if (Test-Path $signedPath) {
            Remove-Item $setupExe -Force
            Move-Item $signedPath $setupExe -Force
            Write-Host "✅ Signed and replaced"
          } else {
            Write-Host "❌ Signing failed"
            exit 1
          }
          Remove-Item $certPath -Force
        } else {
          Write-Host "❌ Setup executable not found at $setupExe"
          Get-ChildItem "Exe/" -Filter "*.exe" | ForEach-Object { Write-Host "  - $($_.Name)" }
          exit 1
        }

    # ─── STEP 6: Buat ZIP dari Setup.exe ────────────────────────────────────
    # ZIP ini yang akan di-download oleh ZeroMix.Installer (bootstrap)
    # URL format: .../releases/latest/download/ZeroMix-Setup.zip
    - name: 📦 Prepare Release Artifacts
      shell: pwsh
      run: |
        $VER = "${{ steps.version.outputs.version }}"
        
        # ZIP dari publish folder (Portable)
        if (Test-Path "publish/win-x64") {
          Write-Host "📦 Creating portable ZIP..."
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "ZeroMix-v$VER-Portable.zip" -Force
          Write-Host "✅ Portable ZIP created"
        } else {
          Write-Host "❌ Publish folder not found"
          exit 1
        }
        
        # Pindahkan Setup.exe ke root dengan nama final
        $setupSrc = "Exe/ZeroMix-Setup-v$VER.exe"
        $setupDst = "ZeroMix-v$VER-Setup.exe"
        if (Test-Path $setupSrc) {
          Move-Item $setupSrc $setupDst -Force
          Write-Host "✅ Setup ready: $setupDst ($([math]::Round((Get-Item $setupDst).Length / 1MB, 1)) MB)"
        } else {
          Write-Host "❌ Setup not found at $setupSrc"
          exit 1
        }
        
        # Buat ZeroMix-Setup.zip → ini yang di-download oleh ZeroMix.Installer
        # Nama file ini HARUS tetap sama di setiap release (tanpa versi di nama)
        # karena URL di bootstrap menggunakan /releases/latest/download/ZeroMix-Setup.zip
        Write-Host "📦 Creating ZeroMix-Setup.zip for bootstrap installer..."
        Compress-Archive -Path $setupDst -DestinationPath "ZeroMix-Setup.zip" -Force
        Write-Host "✅ ZeroMix-Setup.zip ready ($([math]::Round((Get-Item 'ZeroMix-Setup.zip').Length / 1MB, 1)) MB)"

    # ─── STEP 7: Build ZeroMix.Installer (Bootstrap) ───────────────────────
    - name: 🔧 Build ZeroMix.Installer (Bootstrap)
      shell: pwsh
      run: |
        $VER = "${{ steps.version.outputs.version }}"
        $REPO = "${{ github.repository }}"
        
        # Path installer relatif terhadap root repo (ZeroMix.Installer ada di root repo)
        $installerDir = "ZeroMix.Installer"
        $csFile = "$installerDir/MainWindow.xaml.cs"
        
        if (!(Test-Path $csFile)) {
          Write-Host "⚠️  ZeroMix.Installer tidak ditemukan di $installerDir, skipping bootstrap build"
          Write-Host "💡 Pastikan folder ZeroMix.Installer sudah di-push ke repo"
          exit 0
        }
        
        # Update URL download di source code sebelum build
        # URL ini mengarah ke ZeroMix-Setup.zip yang dibuat di step sebelumnya
        $content = Get-Content $csFile -Raw
        $newUrl = "https://github.com/$REPO/releases/latest/download/ZeroMix-Setup.zip"
        $content = $content -replace 'private const string DownloadUrl = ".*?"', "private const string DownloadUrl = `"$newUrl`""
        Set-Content $csFile $content -Encoding UTF8
        Write-Host "✅ URL updated: $newUrl"
        
        # Publish bootstrap sebagai single exe
        dotnet publish "$installerDir/ZeroMix.Installer.csproj" `
          -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true `
          "-p:Version=$($VER -replace '^v', '')" `
          -o installer_output
        
        # Rename output
        $exeSrc = "installer_output/ZeroMix-Installer.exe"
        $exeDst = "ZeroMix-v$VER-Installer.exe"
        if (Test-Path $exeSrc) {
          Move-Item $exeSrc $exeDst -Force
          Write-Host "✅ Bootstrap installer ready: $exeDst ($([math]::Round((Get-Item $exeDst).Length / 1MB, 1)) MB)"
        } else {
          Write-Host "⚠️  Bootstrap build output not found — skipping"
          if (Test-Path "installer_output/") {
            Get-ChildItem "installer_output/" | ForEach-Object { Write-Host "  - $($_.Name)" }
          }
          # Tidak exit 1 — bootstrap opsional, release tetap jalan
        }

    # ─── STEP 8: Generate release notes dari CHANGELOG ──────────────────────
    - name: 📋 Extract Release Notes from CHANGELOG
      shell: pwsh
      run: |
        $VER     = "${{ steps.version.outputs.tag }}"
        $VERNUM  = "${{ steps.version.outputs.version }}" -replace '^v', ''
        $REPO    = "${{ github.repository }}"
        $changelogUrl = "https://github.com/$REPO/blob/main/Docs/CHANGELOG.md"
        $changelog    = Get-Content "Docs/CHANGELOG.md" -Raw

        # Ambil section versi ini dari CHANGELOG
        $pattern = "(?s)## \[v?$([regex]::Escape($VERNUM))\].*?(?=\n## \[|\z)"
        $match   = [regex]::Match($changelog, $pattern)

        $top4 = ""
        if ($match.Success) {
            $section = $match.Value

            # Kumpulkan semua bullet points (✨ 🐛 🔧)
            $bullets = [regex]::Matches($section, '(?m)^- .+') | ForEach-Object { $_.Value.Trim() }

            # Ambil max 4 poin pertama
            $picked = $bullets | Select-Object -First 4
            $top4   = ($picked -join "`n")
        }

        if ([string]::IsNullOrWhiteSpace($top4)) {
            $top4 = "- See full changelog for details."
        }

        $body  = "## 🚀 ZeroMix $VER`n`n"
        $body += "### Highlights`n"
        $body += "$top4`n`n"
        $body += "> 📄 **[View full changelog →]($changelogUrl)**`n`n"
        $body += "---`n`n"
        $body += "### 📥 Downloads`n"
        $body += "| File | Keterangan |`n"
        $body += "|------|------------|`n"
        $body += "| \`\`ZeroMix-v$VERNUM-Installer.exe\`\` | ⭐ Bootstrap — kecil, download otomatis |`n"
        $body += "| \`\`ZeroMix-v$VERNUM-Setup.exe\`\` | Setup lengkap (offline) |`n"
        $body += "| \`\`ZeroMix-v$VERNUM-Portable.zip\`\` | Portable, tanpa install |`n`n"
        $body += "### 🖥️ Requirements`n"
        $body += "- Windows 10/11 x64`n"
        $body += "- .NET 9.0 Desktop Runtime"

        $body | Out-File -FilePath "RELEASE_NOTES.md" -Encoding utf8
        Write-Host "✅ Release notes generated (top 4 highlights + changelog link)"

    # ─── STEP 9: Buat Release entry dulu sebagai DRAFT ──
    # Release dibuat sebagai draft dulu: upload assets dulu baru publish.
    - name: 🏷️ Create GitHub Release (draft)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ZeroMix ${{ steps.version.outputs.tag }}
        body_path: RELEASE_NOTES.md
        draft: true
        prerelease: false
        make_latest: true
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ─── STEP 10: Upload assets (hanya jika file ada / build sukses) ─────────
    - name: 📤 Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        files: |
          ZeroMix-v${{ steps.version.outputs.version }}-Installer.exe
          ZeroMix-v${{ steps.version.outputs.version }}-Setup.exe
          ZeroMix-v${{ steps.version.outputs.version }}-Portable.zip
          ZeroMix-Setup.zip
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ─── STEP 10: Publish Release (make it live) ───────────────────────────────
    - name: 🟢 Publish Release (make live)
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "${{ steps.version.outputs.tag }}"
        $repo = "${{ github.repository }}"
        $url = "https://api.github.com/repos/$repo/releases/tags/$tag"

        Write-Host "Looking up release id for $tag..."
        $resp = Invoke-RestMethod -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = "application/vnd.github.v3+json" } -Uri $url -Method GET
        $id = $resp.id
        if ($null -eq $id) {
          Write-Host "Release not found for tag $tag" -ForegroundColor Red
          exit 1
        }

        Write-Host "Publishing release id $id..."
        $body = @{ draft = $false } | ConvertTo-Json
        Invoke-RestMethod -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = "application/vnd.github.v3+json" } -Uri "https://api.github.com/repos/$repo/releases/$id" -Method PATCH -Body $body
        Write-Host "✅ Release published"
