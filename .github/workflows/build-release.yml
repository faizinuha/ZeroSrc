name: 🚀 Build & Release ZeroMix

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false

jobs:
  build:
    name: 🏗️ Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔢 Determine Version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          TAG="v${{ github.event.inputs.version }}"
        else
          TAG="${{ github.ref_name }}"
        fi
        VERSION=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "🚀 Building ZeroMix $TAG"

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 📦 Restore & Publish
      run: |
        dotnet restore ZeroMix.csproj
        dotnet publish ZeroMix.csproj -c Release -o publish/win-x64 -p:Version=${{ steps.version.outputs.version }} --self-contained true -r win-x64

    - name: 🎬 Download FFMPEG
      shell: pwsh
      run: |
        if (!(Test-Path "FFMPEG")) { New-Item -ItemType Directory -Force -Path "FFMPEG" }
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
        $binDir = Get-ChildItem -Path "ffmpeg_temp" -Filter "bin" -Recurse | Select-Object -First 1
        Copy-Item "$($binDir.FullName)\ffmpeg.exe" -Destination "FFMPEG\ffmpeg.exe" -Force
        Remove-Item "ffmpeg_temp" -Recurse -Force
        Remove-Item "ffmpeg.zip" -Force

    - name: 🛠️ Build Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
      with:
        path: Exe/Setup.iss
        options: /DAppVersion=${{ steps.version.outputs.version }}

    - name: 📦 Prepare Release Artifacts
      shell: pwsh
      run: |
        $VER = "${{ steps.version.outputs.version }}"
        # Create Portable ZIP
        Compress-Archive -Path "publish/win-x64/*" -DestinationPath "ZeroMix-v$VER-Portable.zip"
        # Rename Setup (OutputDir in Setup.iss is '.', base name is ZeroMix-Setup-v...)
        $setupName = "ZeroMix-Setup-v$VER.exe"
        if (Test-Path "Exe/ZeroMix-Setup-v$VER.exe") { 
           Move-Item "Exe/ZeroMix-Setup-v$VER.exe" "ZeroMix-v$VER-Setup.exe" 
        }

    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ZeroMix ${{ steps.version.outputs.tag }}
        body: |
          🎉 **ZeroMix ${{ steps.version.outputs.tag }} is here!**
          
          ### 📥 Downloads
          - **Setup Installer:** `ZeroMix-v${{ steps.version.outputs.version }}-Setup.exe` (Recommended)
          - **Portable Version:** `ZeroMix-v${{ steps.version.outputs.version }}-Portable.zip`
          
          ### 🖥️ Requirements
          - Windows 10/11 x64
          - .NET 9.0 Desktop Runtime (Installer will check automatically)
          
          Check [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.
        files: |
          ZeroMix-v${{ steps.version.outputs.version }}-Setup.exe
          ZeroMix-v${{ steps.version.outputs.version }}-Portable.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


