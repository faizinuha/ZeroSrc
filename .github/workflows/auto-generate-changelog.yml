name: 📝 Auto-Generate CHANGELOG

# Daily workflow - membaca latest release dan lanjut dari sana
on:
  schedule:
    # Setiap hari jam 00:00 UTC (6:00 WIB)
    - cron: '0 0 * * *'
  
  # Manual trigger untuk testing
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-changelog:
    name: Generate & Update CHANGELOG
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch semua history
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Git untuk auto-commit
      - name: 🔧 Setup Git Config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

      # 3. Get latest release info
      - name: 📦 Get Latest Release
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get latest release tag
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "❌ No existing releases found. Using first commit."
            LATEST_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "latest_tag=INITIAL_COMMIT" >> $GITHUB_OUTPUT
          else
            echo "✅ Latest release: $LATEST_TAG"
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      # 4. Get version for next release
      - name: 🔢 Determine Next Version
        id: version
        run: |
          LATEST_TAG=${{ steps.latest_release.outputs.latest_tag }}
          
          if [ "$LATEST_TAG" = "INITIAL_COMMIT" ]; then
            NEXT_VERSION="v1.0.0"
          else
            # Parse semver dari tag (v1.2.3 -> 1.2.3)
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            
            # Increment patch version
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi
          
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "📌 Next version: $NEXT_VERSION"

      # 5. Generate changelog dari commits
      - name: 📋 Generate Changelog
        id: changelog
        env:
          LATEST_TAG: ${{ steps.latest_release.outputs.latest_tag }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          # Create temp file untuk changelog section baru
          TEMP_CHANGELOG="/tmp/new_changelog.md"
          
          if [ "$LATEST_TAG" = "INITIAL_COMMIT" ]; then
            # Dari awal repository
            COMMIT_RANGE="HEAD"
            echo "## [$NEXT_VERSION] - $(date +%Y-%m-%d)" > $TEMP_CHANGELOG
          else
            # Dari latest tag ke HEAD
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
            # Check if ada commits baru
            COMMIT_COUNT=$(git rev-list --count $COMMIT_RANGE 2>/dev/null || echo "0")
            if [ "$COMMIT_COUNT" -eq 0 ]; then
              echo "ℹ️ No new commits since $LATEST_TAG. Skipping update."
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "## [$NEXT_VERSION] - $(date +%Y-%m-%d)" > $TEMP_CHANGELOG
          fi
          
          # Parse commits by type (feat, fix, etc)
          echo "" >> $TEMP_CHANGELOG
          echo "### ✨ Features" >> $TEMP_CHANGELOG
          git log $COMMIT_RANGE --oneline --grep="^feat" --format="- %h: %s" >> $TEMP_CHANGELOG 2>/dev/null || echo "- No new features" >> $TEMP_CHANGELOG
          
          echo "" >> $TEMP_CHANGELOG
          echo "### 🐛 Bug Fixes" >> $TEMP_CHANGELOG
          git log $COMMIT_RANGE --oneline --grep="^fix" --format="- %h: %s" >> $TEMP_CHANGELOG 2>/dev/null || echo "- No bug fixes" >> $TEMP_CHANGELOG
          
          echo "" >> $TEMP_CHANGELOG
          echo "### 🔧 Changes" >> $TEMP_CHANGELOG
          git log $COMMIT_RANGE --oneline --all-match --grep="^chore\\|^refactor\\|^docs\\|^style" --format="- %h: %s" >> $TEMP_CHANGELOG 2>/dev/null || echo "- No other changes" >> $TEMP_CHANGELOG
          
          echo "" >> $TEMP_CHANGELOG
          echo "### 📊 Commit Summary" >> $TEMP_CHANGELOG
          TOTAL=$(git rev-list --count $COMMIT_RANGE 2>/dev/null || echo "0")
          echo "- Total commits: **$TOTAL**" >> $TEMP_CHANGELOG
          echo "- Date range: $LATEST_TAG to HEAD" >> $TEMP_CHANGELOG
          
          # Append existing CHANGELOG if exists
          if [ -f "CHANGELOG.md" ]; then
            echo "" >> $TEMP_CHANGELOG
            cat CHANGELOG.md >> $TEMP_CHANGELOG
          fi
          
          # Move temporary file to CHANGELOG.md
          mv $TEMP_CHANGELOG CHANGELOG.md
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "✅ CHANGELOG updated: $NEXT_VERSION"

      # 6. Check if ada changes
      - name: 📝 Check Changes
        id: check_changes
        run: |
          if git diff --quiet CHANGELOG.md 2>/dev/null; then
            echo "No changes to CHANGELOG.md"
            echo "has_file_changes=false" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG.md has been updated"
            echo "has_file_changes=true" >> $GITHUB_OUTPUT
            echo ""
            echo "📄 Changes preview:"
            git diff CHANGELOG.md | head -50
          fi

      # 7. Auto-commit changes
      - name: 💾 Auto-Commit Changelog
        if: steps.check_changes.outputs.has_file_changes == 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for $NEXT_VERSION" \
            -m "Auto-generated changelog from commits since last release" \
            -m "Workflow: Auto-Generate CHANGELOG"
          git push origin ${{ github.ref }}

      # 8. Summary
      - name: 📊 Workflow Summary
        run: |
          echo "🎯 Workflow Summary:"
          echo "├─ Latest Release: ${{ steps.latest_release.outputs.latest_tag }}"
          echo "├─ Next Version: ${{ steps.version.outputs.next_version }}"
          echo "├─ Changes Found: ${{ steps.changelog.outputs.has_changes }}"
          echo "├─ File Updated: ${{ steps.check_changes.outputs.has_file_changes }}"
          echo "└─ Status: ✅ Complete"

      # 9. Notification (optional)
      - name: 🔔 Create Issue if No Changes
        if: steps.changelog.outputs.has_changes != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ℹ️ No new commits to process"
