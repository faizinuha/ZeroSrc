name: 📝 Update CHANGELOG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔖 Get Release Info
      id: release
      shell: bash
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        DATE=$(date +'%Y-%m-%d')
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "date=$DATE" >> $GITHUB_OUTPUT

        PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -v "^$TAG$" | head -1)
        echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

    - name: 📝 Inject Entry into CHANGELOG
      shell: bash
      run: |
        TAG=${{ steps.release.outputs.tag }}
        VERSION=${{ steps.release.outputs.version }}
        DATE=${{ steps.release.outputs.date }}
        PREV_TAG=${{ steps.release.outputs.prev_tag }}

        # Skip jika entry versi ini sudah ada
        if grep -q "\[$TAG\]" CHANGELOG.md; then
          echo "ℹ️ Entry $TAG already exists in CHANGELOG, skipping."
          exit 0
        fi

        # Ambil commit log sejak tag sebelumnya
        if [ -z "$PREV_TAG" ]; then
          RANGE="HEAD"
        else
          RANGE="$PREV_TAG..$TAG"
        fi

        FEATURES=$(git log $RANGE --pretty=format:"- %s" --grep="^feat" 2>/dev/null)
        FIXES=$(git log $RANGE --pretty=format:"- %s" --grep="^fix" 2>/dev/null)

        [ -z "$FEATURES" ] && FEATURES="- No new features"
        [ -z "$FIXES" ] && FIXES="- No bug fixes"

        # Buat entry baru
        NEW_ENTRY="## [$TAG] - $DATE\n\n### ✨ Features\n$FEATURES\n\n### 🐛 Bug Fixes\n$FIXES\n\n---\n"

        # Inject setelah baris "---" pertama (setelah header)
        awk -v entry="$NEW_ENTRY" '
          /^---$/ && !inserted { print; printf "\n" entry; inserted=1; next }
          { print }
        ' CHANGELOG.md > /tmp/changelog_new.md

        mv /tmp/changelog_new.md  CHANGELOG.md
        echo "✅ CHANGELOG updated for $TAG"

    - name: 💾 Commit & Push
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add CHANGELOG.md
        if git diff --cached --quiet; then
          echo "ℹ️ No changes to commit"
        else
          git commit -m "docs: update CHANGELOG for ${{ steps.release.outputs.tag }} [skip ci]"
          git push origin HEAD
          echo "✅ Pushed"
        fi
      continue-on-error: true
