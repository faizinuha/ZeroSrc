name: 📄 Generate Release Notes (DISABLED - Using build-release.yml instead)

on:
  workflow_dispatch:
    # This workflow is kept for reference but not used
    # The build-release.yml handles everything

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for changelog

    - name: 🔖 Determine Version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event.inputs.tag }}" != "" ]; then
          TAG=${{ github.event.inputs.tag }}
        else
          TAG=${GITHUB_REF#refs/tags/}
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        echo "Release version: $TAG"

    - name: 📝 Generate Changelog from Commits
      id: changelog
      shell: bash
      run: |
        TAG=${{ steps.version.outputs.tag }}
        PREV_TAG=$(git tag -l 'v*' --sort=-version:refname 2>/dev/null | head -2 | tail -1)
        
        # Build commit range
        if [ -z "$PREV_TAG" ]; then
          COMMIT_RANGE="--all"
          RANGE_DESC="Initial Release"
        else
          COMMIT_RANGE="$PREV_TAG..$TAG"
          RANGE_DESC="Changes since $PREV_TAG"
        fi
        
        # Initialize changelog file
        > /tmp/changelog.md
        
        # Features section
        FEATURES=$(git log $COMMIT_RANGE --oneline --grep="feat" --grep="feature" --grep="Feature" --all-match --pretty=format:"- %s" 2>/dev/null | sort | uniq)
        if [ -n "$FEATURES" ]; then
          echo "### ✨ Features" >> /tmp/changelog.md
          echo "$FEATURES" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
        fi
        
        # Bug fixes section
        BUGFIXES=$(git log $COMMIT_RANGE --oneline --grep="fix" --grep="bug" --grep="Bug" --all-match --pretty=format:"- %s" 2>/dev/null | sort | uniq)
        if [ -n "$BUGFIXES" ]; then
          echo "### 🐛 Bug Fixes" >> /tmp/changelog.md
          echo "$BUGFIXES" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
        fi
        
        # Improvements section
        IMPROVEMENTS=$(git log $COMMIT_RANGE --oneline --grep="improve\|improvement\|refactor\|perf\|performance" --all-match --pretty=format:"- %s" 2>/dev/null | sort | uniq)
        if [ -n "$IMPROVEMENTS" ]; then
          echo "### 🚀 Improvements" >> /tmp/changelog.md
          echo "$IMPROVEMENTS" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
        fi
        
        # Other commits
        OTHER=$(git log $COMMIT_RANGE --oneline --pretty=format:"- %s" 2>/dev/null | head -20 | tail -n +1)
        if [ -n "$OTHER" ]; then
          total_commits=$(git log $COMMIT_RANGE --oneline 2>/dev/null | wc -l)
          if [ $total_commits -gt 20 ]; then
            echo "### 📝 Other Changes ($total_commits commits)" >> /tmp/changelog.md
            echo "$OTHER" >> /tmp/changelog.md
            echo "... and $((total_commits - 20)) more commits" >> /tmp/changelog.md
            echo "" >> /tmp/changelog.md
          fi
        fi
        
        if [ ! -s /tmp/changelog.md ]; then
          echo "### 📋 Changes" >> /tmp/changelog.md
          echo "- No commits found matching major change patterns" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
        fi
        
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        cat /tmp/changelog.md >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: 🌟 Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: "🎉 ZeroMix ${{ steps.version.outputs.tag }}"
        body: |
          # 🎉 ZeroMix Release ${{ steps.version.outputs.tag }}
          
          ## 📊 Release Summary
          
          **Version:** `${{ steps.version.outputs.version }}`  
          **Branch:** `ProyekTil`  
          **Status:** ✅ Stable Release  
          
          ---
          
          ## 📋 What's Changed
          
          ${{ env.CHANGELOG }}
          
          ---
          
          ## 📥 Installation & Download
          
          Download the latest version from the links below:
          
          - **Windows (64-bit):** `ZeroMix-Installer-${{ steps.version.outputs.tag }}.exe`
          - **Source Code:** [ZIP](https://github.com/faizinuha/ZeroMix/archive/refs/tags/${{ steps.version.outputs.tag }}.zip) | [TAR.GZ](https://github.com/faizinuha/ZeroMix/archive/refs/tags/${{ steps.version.outputs.tag }}.tar.gz)
          
          ### Quick Start
          ```powershell
          # Run installer
          .\ZeroMix-Installer-${{ steps.version.outputs.tag }}.exe
          
          # Or extract and run directly
          ZeroMix.exe
          ```
          
          ## 🖥️ System Requirements
          
          | Requirement | Version |
          |-------------|---------|
          | **OS** | Windows 10/11 (64-bit) |
          | **.NET** | 9.0 or later |
          | **GPU** | DirectX 12 compatible |
          | **RAM** | 2GB minimum / 4GB recommended |
          
          ## 📖 Documentation
          
          - 📚 [Full Documentation](https://github.com/faizinuha/ZeroMix/wiki)
          - 🐛 [Report Issue](https://github.com/faizinuha/ZeroMix/issues/new)
          - 💬 [Join Discussions](https://github.com/faizinuha/ZeroMix/discussions)
          - 📝 [View CHANGELOG](https://github.com/faizinuha/ZeroMix/blob/ProyekTil/CHANGELOG.md)
          
          ## 🙏 Contributors
          
          Thanks to all contributors who helped make this release possible!
          
          ---
          
          **❤️ Support ZeroMix by giving us a ⭐**
          
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: ✅ Release Success Notification
      run: |
        VERSION="${{ steps.version.outputs.tag }}"
        echo "✅ Release Published Successfully!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Version: $VERSION"
        echo "URL: https://github.com/faizinuha/ZeroMix/releases/tag/$VERSION"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
