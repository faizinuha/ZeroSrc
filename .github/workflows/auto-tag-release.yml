name: 📌 Auto Tag & Release

on:
  push:
    branches:
      - ProyekTil
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'

permissions:
  contents: write
  packages: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Git Config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

      - name: 🏷️ Determine & Update Version
        id: versioning
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          LAST_TAG=$(git tag -l 'v[0-9]*' --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then LAST_TAG="v0.0.0"; fi
          
          # Extract version
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Default bump: Patch
          NEW_MAJOR=$MAJOR
          NEW_MINOR=$MINOR
          NEW_PATCH=$((PATCH + 1))
          
          if [[ $COMMIT_MSG =~ ^feat: ]]; then
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
          elif [[ $COMMIT_MSG == *"BREAKING CHANGE"* ]]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
          fi
          
          NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          TAG="v$NEW_VERSION"
          
          # AUTO-INCREMENT LOOP to avoid duplicate tag error
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            echo "⚠️ Tag $TAG exists. Incrementing patch..."
            NEW_PATCH=$((NEW_PATCH + 1))
            NEW_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
            TAG="v$NEW_VERSION"
          done
          
          echo "🚀 Final version decided: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 📝 Update Version in Files
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          
          # Update src/MainWindow.xaml.cs
          sed -i "s/private const string CURRENT_VERSION = \".*\";/private const string CURRENT_VERSION = \"$VERSION\";/g" src/MainWindow.xaml.cs
          
          # Update Exe/Setup.iss
          sed -i "s/#define AppVersion \".*\"/#define AppVersion \"$VERSION\"/g" Exe/Setup.iss
          
          # Update ZeroMix.csproj
          sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/g" ZeroMix.csproj
          
          # Commit changes if any
          git add src/MainWindow.xaml.cs Exe/Setup.iss ZeroMix.csproj
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push origin ProyekTil
          fi

      - name: 🏷️ Push Tag
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ Tag '$TAG' pushed!"
