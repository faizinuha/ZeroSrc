name: Build ZeroMix Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Get version from tag
      - name: Get Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $env:GITHUB_ENV

      # 3️⃣ Setup .NET
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 4️⃣ Setup MSBuild
      - uses: microsoft/setup-msbuild@v2

      # 5️⃣ Install Inno Setup
      - uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install innosetup -y

      # 6️⃣ Publish app
      - name: Publish ZeroMix
        run: |
          dotnet publish ZeroMix.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:Version=${{ env.VERSION }}

      # 7️⃣ Build installer
      - name: Build Installer
        run: |
          ISCC.exe "Exe\Setup.iss" /DAppVersion=${{ env.VERSION }}

      # 8️⃣ Decode certificate
      - name: Decode Certificate
        run: |
          echo "${{ secrets.CERT_PFX_BASE64 }}" > cert.txt
          certutil -decode cert.txt ZeroMixCert.pfx

      # 9️⃣ Sign installer
      - name: Sign Installer
        run: |
          signtool sign `
            /f ZeroMixCert.pfx `
            /p "${{ secrets.CERT_PASS }}" `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            Exe/ZeroMix-Setup-v${{ env.VERSION }}.exe

      # 🔟 Upload artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroMix-Installer
          path: Exe/ZeroMix-Setup-v${{ env.VERSION }}.exe

      # 1️⃣1️⃣ Release
      - uses: softprops/action-gh-release@v2
        with:
          name: ZeroMix v${{ env.VERSION }}
          files: Exe/ZeroMix-Setup-v${{ env.VERSION }}.exe
