name: 📦 Publish ZeroMix.PluginSDK

on:
  # Otomatis publish saat ada release baru
  release:
    types: [published]
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK Version (e.g., 1.0.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 🔢 Set Version
      id: ver
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # Ambil dari tag release, strip 'v' prefix
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Publishing SDK v$VERSION"

    - name: 📦 Pack SDK
      run: |
        dotnet pack ZeroMix.PluginSDK/ZeroMix.PluginSDK.csproj \
          -c Release \
          -p:Version=${{ steps.ver.outputs.version }} \
          -o ./nupkg
      working-directory: ZeroMix

    - name: 🚀 Publish to GitHub Packages
      run: |
        dotnet nuget push ./nupkg/*.nupkg \
          --source "https://nuget.pkg.github.com/faizinuha/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate
      working-directory: ZeroMix
