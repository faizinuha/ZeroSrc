name: ZeroMix CI/CD

on:
  push:
    branches: [ "ProyekTil" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "ProyekTil" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: ZeroMix.sln
      Project_Path: ZeroMix.csproj
      Configuration: Release

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x # Matching TargetFramework in csproj

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    - name: Build
      run: dotnet build ${{ env.Solution_Name }} --configuration ${{ env.Configuration }} --no-restore

    - name: Publish (Self-Contained Single File)
      run: |
        dotnet publish ${{ env.Project_Path }} `
          --configuration ${{ env.Configuration }} `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          --output ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZeroMix-Binary
        path: ./publish/ZeroMix.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./publish/ZeroMix.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

