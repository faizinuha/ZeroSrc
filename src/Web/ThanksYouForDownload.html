<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terima Kasih – ZeroMix</title>
    <link rel="icon" href="./zeromix-high-resolution-logo-transparent.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      .thanks-wrapper {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px;
      }
      .thanks-icon {
        font-size: 72px;
        margin-bottom: 20px;
        animation: pop 0.5s ease;
      }
      @keyframes pop {
        0%   { transform: scale(0.5); opacity: 0; }
        80%  { transform: scale(1.1); }
        100% { transform: scale(1);   opacity: 1; }
      }
      .thanks-title {
        font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 10px;
        color: #fff;
      }
      .thanks-sub {
        font-size: 1rem;
        color: #888;
        margin-bottom: 8px;
      }
      .file-badge {
        display: inline-block;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 8px 18px;
        font-size: 0.9rem;
        color: #00d68f;
        margin: 12px 0 28px;
        font-family: monospace;
      }
      .countdown-text {
        font-size: 0.95rem;
        color: #666;
        margin-bottom: 24px;
      }
      .countdown-text span {
        color: #00d68f;
        font-weight: bold;
      }
      .progress-bar-wrap {
        width: 320px;
        height: 4px;
        background: #1a1a2e;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 32px;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00a37a, #00d68f);
        border-radius: 4px;
        transition: width 0.1s linear;
      }
      .action-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn-manual {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .btn-manual:hover { opacity: 0.85; }
      .btn-primary {
        background: linear-gradient(90deg, #00a37a, #0066cc);
        color: #fff;
        border: none;
      }
      .btn-secondary {
        background: #111;
        color: #8899aa;
        border: 1px solid #222;
      }
      .support-note {
        margin-top: 48px;
        padding: 20px 28px;
        background: #0a0a14;
        border: 1px solid #1a1a2e;
        border-radius: 12px;
        max-width: 420px;
        color: #666;
        font-size: 0.88rem;
        line-height: 1.6;
      }
      .support-note a { color: #00d68f; text-decoration: none; }
      .support-note a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-logo">ZeroMix</a>
      </div>
    </nav>

    <div class="thanks-wrapper">
      <div class="thanks-icon">⚡</div>
      <h1 class="thanks-title">Terima Kasih!</h1>
      <p class="thanks-sub">Download kamu akan segera dimulai secara otomatis.</p>
      <div id="file-badge" class="file-badge">Memuat...</div>
      <p class="countdown-text">Mulai otomatis dalam <span id="countdown">5</span> detik...</p>
      <div class="progress-bar-wrap">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div class="action-buttons">
        <a id="manual-btn" href="#" class="btn-manual btn-primary">
          <i class="fas fa-download"></i> Download Manual
        </a>
        <a href="Changelog.html" class="btn-manual btn-secondary">
          <i class="fas fa-arrow-left"></i> Kembali
        </a>
      </div>

      <div class="support-note">
        ZeroMix selalu gratis. Kalau kamu suka, pertimbangkan untuk
        <a href="https://trakteer.id/MyCici" target="_blank" rel="noopener noreferrer">support via Trakteer</a>
        atau
        <a href="https://sociabuzz.com/zuax/tribe" target="_blank" rel="noopener noreferrer">Sociabuzz</a>. 🙏
      </div>
    </div>

    <footer>
      <p>&copy; 2026 ZeroMix Project – Dibuat dengan ❤️ oleh Zaki</p>
    </footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const rawFileUrl = params.get("url");
      const fileName = params.get("name") || "ZeroMix-Setup.exe";

      function sanitizeDownloadUrl(input) {
        if (!input) return null;
        try {
          const parsed = new URL(input, window.location.origin);
          if (parsed.protocol === "http:" || parsed.protocol === "https:") {
            return parsed.href;
          }
        } catch (_) {}
        return null;
      }

      const fileUrl = sanitizeDownloadUrl(rawFileUrl);

      // Tampilkan nama file
      document.getElementById("file-badge").textContent = fileName;

      // Set tombol manual
      const manualBtn = document.getElementById("manual-btn");
      if (fileUrl) manualBtn.href = fileUrl;

      // Countdown + progress bar
      const DURATION = 5000; // ms
      const INTERVAL = 50;
      let elapsed = 0;

      const fill      = document.getElementById("progress-fill");
      const countdown = document.getElementById("countdown");

      const timer = setInterval(() => {
        elapsed += INTERVAL;
        const pct = Math.min((elapsed / DURATION) * 100, 100);
        fill.style.width = pct + "%";
        countdown.textContent = Math.max(Math.ceil((DURATION - elapsed) / 1000), 0);

        if (elapsed >= DURATION) {
          clearInterval(timer);
          if (fileUrl) {
            // Trigger download via hidden anchor
            const a = document.createElement("a");
            a.href = fileUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }
        }
      }, INTERVAL);
    </script>
  </body>
</html>
