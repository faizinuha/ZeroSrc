<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Live2D Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent; /* Dark background to prevent white flicker */
      }
      #canvas {
        width: 100%;
        height: 100%;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #00d68f; /* Neon Blue instead of pink */
        font-family: "Segoe UI", sans-serif;
      }
      #loading .emoji {
        font-size: 48px;
        margin-bottom: 10px;
      }
      #loading .text {
        font-size: 14px;
        opacity: 0.8;
      }

    </style>
  </head>
  <body>
    <div id="loading">
      <div class="emoji">🎭</div>
      <div class="text">Loading Live2D...</div>
    </div>
    <canvas id="canvas"></canvas>

    <!-- PIXI.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <!-- Live2D Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

    <script>
      // Configuration
      let MODEL_PATH = "";

      // Global state
      let app = null;
      let model = null;
      let targetEyeX = 0,
        targetEyeY = 0;
      let currentEyeX = 0,
        currentEyeY = 0;
      let isModelLoaded = false;
      let autoMotionTimer = null;

      // Log Proxy to WPF Terminal
      const originalLog = console.log;
      const originalWarn = console.warn;
      const originalError = console.error;

      function sendToWPF(type, args) {
        if (window.chrome && window.chrome.webview) {
          const msg = Array.from(args)
            .map((a) => (typeof a === "object" ? JSON.stringify(a) : a))
            .join(" ");
          window.chrome.webview.postMessage({
            type: "log",
            level: type,
            content: msg,
          });
        }
      }

      console.log = function () {
        originalLog.apply(console, arguments);
        sendToWPF("info", arguments);
      };
      console.warn = function () {
        originalWarn.apply(console, arguments);
        sendToWPF("warn", arguments);
      };
      console.error = function () {
        originalError.apply(console, arguments);
        sendToWPF("error", arguments);
      };

      // Initialize
      async function init() {
        console.log("[Live2D] Initializing PIXI...");
        const canvas = document.getElementById("canvas");
        const loading = document.getElementById("loading");

        // Check for model path in URL
        const urlParams = new URLSearchParams(window.location.search);
        const modelParam = urlParams.get("model");
        if (modelParam) MODEL_PATH = modelParam;

        try {
          app = new PIXI.Application({
            view: canvas,
            backgroundAlpha: 0,
            resizeTo: window,
            antialias: false, // Turned off antialias for better performance
            powerPreference: "high-performance", // Changed to high-performance for Huohuo
            autoDensity: true,
          });

          app.ticker.maxFPS = 30;
          console.log("[Live2D] PIXI App created at 30 FPS");

          if (MODEL_PATH) {
            console.log("[Live2D] Loading initial model:", MODEL_PATH);
            await loadModel(MODEL_PATH);
          } else {
            console.log("[Live2D] Ready. Waiting for model from WPF...");
            loading.style.display = "none"; // Hide loading if no initial model
          }

          app.ticker.add(updateLoop);

          // RAM Optimization: Throttle when window is not active or minimized
          window.addEventListener("blur", () => {
            app.ticker.maxFPS = 15;
            // Free GPU memory suggest
            if (typeof PIXI.utils.clearTextureCache === 'function') PIXI.utils.clearTextureCache();
          });
          window.addEventListener("focus", () => {
            app.ticker.maxFPS = 30;
          });

          // Auto-Motion every 5-10 seconds (random interval for natural feel)
          if (autoMotionTimer) clearInterval(autoMotionTimer);
          autoMotionTimer = setInterval(() => {
            if (isModelLoaded) playIdleMotion();
          }, 5000 + Math.random() * 5000); // 5-10 seconds

          console.log("[Live2D] Initialized");
        } catch (error) {
          console.error("[Live2D] Init error:", error);
          showError();
        }
      }

      async function loadModel(path) {
        if (!path) {
          isModelLoaded = false;
          return;
        }
        const canvas = document.getElementById("canvas");
        const loading = document.getElementById("loading");
        loading.style.display = "block";
        loading.querySelector(".text").textContent = "Loading model...";

        isModelLoaded = false;
        if (model) {
          app.stage.removeChild(model);
          // Standard PIXI + Live2D cleanup
          model.destroy({ children: true, texture: true, baseTexture: true });
          model = null; 
          // Suggest browser to garbage collect
          if (typeof PIXI.utils.clearTextureCache === 'function') PIXI.utils.clearTextureCache();
        }

        // Clear any cached resources for this path
        const cacheBuster = '?t=' + Date.now();
        const cacheBustedPath = path + cacheBuster;

        try {
          model = await PIXI.live2d.Live2DModel.from(cacheBustedPath, {
            autoInteract: true,
            autoUpdate: true,
          });

          model.anchor.set(0.5, 1);

          // AUTO SCALE: Calculate scale to fit window height (with 20px padding)
          const targetHeight = app.screen.height - 40;
          const currentHeight = model.height;
          const autoScale = (targetHeight / currentHeight) * model.scale.x;
          model.scale.set(autoScale);

          model.x = app.screen.width / 2;
          model.y = app.screen.height;

          app.stage.addChild(model);
          loading.style.display = "none";
          canvas.style.opacity = "1";
          isModelLoaded = true;

          // Try to hide watermark parts if found
          try {
            const parts = model.internalModel.coreModel._partIds;
            parts.forEach((id, index) => {
              if (
                id.toLowerCase().includes("illust") ||
                id.toLowerCase().includes("text")
              ) {
                model.internalModel.coreModel.setPartOpacityByIndex(index, 0);
              }
            });
          } catch (e) {}

          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: "model_loaded" });
          }

          model.on("pointerdown", onModelClick);
          model.interactive = true;
          model.cursor = "pointer";

          // Re-adjust on next frame to be sure
          setTimeout(() => {
            const finalRatio = (app.screen.height - 40) / model.height;
            model.scale.set(model.scale.x * finalRatio);
            model.y = app.screen.height;
          }, 100);
        } catch (e) {
          console.error("[Live2D] Load error:", e);
          showError();
        }
      }

      function showError() {
        const loading = document.getElementById("loading");
        loading.style.display = "block";
        loading.querySelector(".emoji").textContent = "😢";
        loading.querySelector(".text").textContent =
          "Model tidak ditemukan atau rusak";
      }

      async function changeModel(path) {
        console.log("[Live2D] Changing model to:", path);
        await loadModel(path);
      }

      // Dragging support from JS to WPF
      let isDragging = false;
      let startX, startY;

      window.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.screenX;
        startY = e.screenY;
      });

      window.addEventListener("mousemove", (e) => {
        if (isDragging && window.chrome && window.chrome.webview) {
          const deltaX = e.screenX - startX;
          const deltaY = e.screenY - startY;

          if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
            window.chrome.webview.postMessage({
              type: "drag",
              deltaX: deltaX,
              deltaY: deltaY,
            });
            startX = e.screenX;
            startY = e.screenY;
          }
        }
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      let isMotionPlaying = false;

      function onModelClick() {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ type: "click" });
        }

        if (!isMotionPlaying) {
          playIdleMotion();
        }
      }

      async function playIdleMotion() {
        if (!model || !model.internalModel || isMotionPlaying) return;

        try {
          isMotionPlaying = true;
          let expressions = [];

          if (MODEL_PATH.toLowerCase().includes("frieren")) {
            expressions = [
              "anya",
              "anya2",
              "yy",
              "ku",
              "han",
              "mmy",
              "d",
              "lks",
              "wh",
              "zx",
              "W",
              "erd",
            ];
            // Play a random motion from any available group
            model.motion("Idle");
          } else if (MODEL_PATH.toLowerCase().includes("fern")) {
            expressions = ["lh", "sq", "sy"];
            model.motion("Idle");
          } else if (MODEL_PATH.toLowerCase().includes("huohuo")) {
            expressions = [
              "angry",
              "baozhen",
              "cry",
              "qizi1",
              "qizi2",
              "white eyes",
            ];
            // For Huohuo, we use direct motion names from his json if known,
            // or just let PIXI handle expressions which is lighter.
            // Avoiding model.motion("") as it might be unstable on this model.
          }

          if (expressions.length > 0) {
            const randomExp =
              expressions[Math.floor(Math.random() * expressions.length)];
            model.expression(randomExp);
            console.log("[Live2D] Playing expression:", randomExp);
          }

          // Reset motion flag after 3 seconds
          setTimeout(() => {
            isMotionPlaying = false;
          }, 3000);
        } catch (e) {
          console.error("[Live2D] Error playing motion:", e);
          isMotionPlaying = false;
        }
      }

      function updateEyeTracking(x, y) {
        targetEyeX = x;
        targetEyeY = y;
      }

      function updateLoop() {
        if (!isModelLoaded || !model || !model.internalModel) return;

        currentEyeX += (targetEyeX - currentEyeX) * 0.1;
        currentEyeY += (targetEyeY - currentEyeY) * 0.1;

        const coreModel = model.internalModel.coreModel;
        if (!coreModel) return;

        try {
          // Support multiple parameter naming conventions
          const paramMap = {
            ParamEyeBallX: currentEyeX,
            ParamEyeBallY: currentEyeY, // Di-balik agar ke atas ya ke atas
            ParamAngleX: currentEyeX * 15,
            ParamAngleY: currentEyeY * 10,
            ParamBodyAngleX: currentEyeX * 5,
            ParamEyeBallX01: currentEyeX,
            ParamEyeBallY01: currentEyeY,
            ParamEyeX: currentEyeX,
            ParamEyeY: currentEyeY,
          };

          for (const [key, val] of Object.entries(paramMap)) {
            const index = coreModel.getParameterIndex(key);
            if (index >= 0) coreModel.setParameterValueByIndex(index, val);
          }
        } catch (e) {}
      }

      window.addEventListener("resize", () => {
        if (app && model) {
          model.x = app.screen.width / 2;
          model.y = app.screen.height;
        }
      });

      // SPEECH RECOGNITION (STT)
      let recognition = null;
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'id-ID'; 
        
        recognition.onresult = (event) => {
          const text = event.results[0][0].transcript;
          console.log("[STT] Result:", text);
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: "speech_result", text: text });
          }
        };

        recognition.onerror = (event) => {
          console.error("[STT] Error:", event.error);
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: "speech_error", error: event.error });
          }
        };

        recognition.onend = () => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ type: "speech_end" });
          }
        };
      }

      // SPEECH SYNTHESIS (TTS)
      let synthesis = window.speechSynthesis;
      let mouthOpenTimer = null;

      function speakText(text, lang = 'id-ID') {
        if (!synthesis) return;
        
        // Stop any current speech
        synthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 1.0;
        utterance.pitch = 1.1; // Slightly higher for anime vibe

        utterance.onstart = () => {
             startLipSync();
             if (window.chrome && window.chrome.webview) {
                 window.chrome.webview.postMessage({ type: "speech_start" });
             }
        };

        utterance.onend = () => {
            stopLipSync();
            if (window.chrome && window.chrome.webview) {
                 window.chrome.webview.postMessage({ type: "speech_finished" });
             }
        };

        synthesis.speak(utterance);
      }

      function startLipSync() {
          if (mouthOpenTimer) clearInterval(mouthOpenTimer);
          mouthOpenTimer = setInterval(() => {
              if (isModelLoaded && model && model.internalModel) {
                  const coreModel = model.internalModel.coreModel;
                  const index = coreModel.getParameterIndex("ParamMouthOpenY");
                  if (index >= 0) {
                      // Simple random mouth movement
                      const val = Math.random() * 0.8;
                      coreModel.setParameterValueByIndex(index, val);
                  }
              }
          }, 100);
      }

      function stopLipSync() {
          if (mouthOpenTimer) {
              clearInterval(mouthOpenTimer);
              mouthOpenTimer = null;
          }
          // Close mouth
          if (isModelLoaded && model && model.internalModel) {
              const coreModel = model.internalModel.coreModel;
              const index = coreModel.getParameterIndex("ParamMouthOpenY");
              if (index >= 0) coreModel.setParameterValueByIndex(index, 0);
          }
      }

      function startSpeech(lang = 'id-ID') {
        if (recognition) {
          recognition.lang = lang;
          try { recognition.start(); } catch(e) { console.error(e); }
        }
      }

      function stopSpeech() {
        if (recognition) {
          try { recognition.stop(); } catch(e) {}
        }
      }

      // Start
      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
