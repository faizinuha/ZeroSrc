<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Live2D Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #canvas {
      width: 100%;
      height: 100%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #00d68f;
      font-family: "Segoe UI", sans-serif;
      pointer-events: none;
    }

    #loading .emoji {
      font-size: 40px;
      margin-bottom: 8px;
    }

    #loading .text {
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="emoji">ðŸŽ­</div>
    <div class="text">Loading Live2D...</div>
  </div>
  <canvas id="canvas"></canvas>

  <!-- PIXI.js â€” pinned version for stability, SRI hash untuk keamanan -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Live2D Cubism Core -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <!-- pixi-live2d-display -->
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

  <script>
    // â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let MODEL_PATH = "";
    let app = null;
    let model = null;
    let targetEyeX = 0, targetEyeY = 0;
    let currentEyeX = 0, currentEyeY = 0;
    let isModelLoaded = false;
    let isMotionPlaying = false;
    let isBodyMotionPlaying = false;
    let autoMotionTimer = null;
    let idleMotionTimer = null;
    let mouthOpenTimer = null;
    let isLoadingModel = false;   // guard against concurrent loads

    // â”€â”€ WPF log proxy â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function sendToWPF(type, args) {
      if (window.chrome && window.chrome.webview) {
        const msg = Array.from(args).map(a => typeof a === "object" ? JSON.stringify(a) : a).join(" ");
        window.chrome.webview.postMessage({ type: "log", level: type, content: msg });
      }
    }
    const _log = console.log; console.log = function () { _log.apply(console, arguments); sendToWPF("info", arguments); };
    const _err = console.error; console.error = function () { _err.apply(console, arguments); sendToWPF("error", arguments); };

    // â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function init() {
      const canvas = document.getElementById("canvas");
      const loading = document.getElementById("loading");

      const urlParams = new URLSearchParams(window.location.search);
      const modelParam = urlParams.get("model");
      if (modelParam) MODEL_PATH = modelParam;

      try {
        app = new PIXI.Application({
          view: canvas,
          backgroundAlpha: 0,
          resizeTo: window,
          antialias: false,
          powerPreference: "low-power",
          autoDensity: false,          // matikan autoDensity â€” hemat RAM signifikan
          resolution: 1,               // paksa 1x, bukan devicePixelRatio
        });

        // Cap FPS ketat untuk spek rendah
        app.ticker.maxFPS = 24;

        app.ticker.add(updateLoop);

        // Throttle saat tidak aktif â€” gunakan visibility API untuk menghemat resources saat tersembunyi
        function updateTickerForVisibility() {
          if (document.hidden) { app.ticker.maxFPS = 8; }
          else { app.ticker.maxFPS = MODEL_PATH.toLowerCase().includes("huohuo") ? 18 : 24; }
        }
        window.addEventListener("blur", () => updateTickerForVisibility());
        window.addEventListener("focus", () => updateTickerForVisibility());
        document.addEventListener("visibilitychange", updateTickerForVisibility);

        if (MODEL_PATH) {
          await loadModel(MODEL_PATH);
        } else {
          loading.style.display = "none";
        }

        // Auto-expression every 6â€“12 s for natural idle feel
        startAutoMotion();

        console.log("[Live2D] Initialized");
      } catch (err) {
        console.error("[Live2D] Init error:", err);
        showError();
      }
    }

    // â”€â”€ Load model â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€    let loadRetryCount = 0;
    const MAX_RETRIES = 2;

    async function loadModel(path) {
      if (!path || isLoadingModel) return;
      isLoadingModel = true;
      const loadStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

      const loading = document.getElementById("loading");
      const canvas = document.getElementById("canvas");

      loading.querySelector(".emoji").textContent = "ðŸŽ­";
      loading.querySelector(".text").textContent = "Loading model...";
      loading.style.display = "block";
      canvas.style.opacity = "0";
      isModelLoaded = false;

      // Stop semua timer dulu agar tidak ada script jalan saat loading
      stopAutoMotion();
      resetMotionFlags();

      // Destroy previous model + aggressive cleanup
      if (model) {
        app.stage.removeChild(model);
        try { model.destroy({ children: true, texture: true, baseTexture: true }); } catch (e) { }
        model = null;
      }

      // Bersihkan semua texture cache
      if (typeof PIXI.utils.clearTextureCache === "function") PIXI.utils.clearTextureCache();
      if (typeof PIXI.utils.destroyTextureCache === "function") PIXI.utils.destroyTextureCache();
      PIXI.BaseTexture.removeFromCache && Object.keys(PIXI.utils.BaseTextureCache || {})
        .forEach(k => { try { PIXI.utils.BaseTextureCache[k]?.destroy(true); } catch (e) { } });

      // Aggressive PIXI texture cleanup to avoid VRAM leaks
      try {
        const baseCache = PIXI.utils?.BaseTextureCache || {};
        for (const k in baseCache) {
          try { baseCache[k] && baseCache[k].destroy && baseCache[k].destroy(true); } catch (e) { }
          try { delete PIXI.utils.BaseTextureCache[k]; } catch (e) { }
        }
        const texCache = PIXI.utils?.TextureCache || {};
        for (const k in texCache) {
          try { const t = texCache[k]; if (t && t.baseTexture && t.baseTexture.destroy) t.baseTexture.destroy(true); } catch (e) { }
          try { delete PIXI.utils.TextureCache[k]; } catch (e) { }
        }
        if (PIXI.utils && typeof PIXI.utils.clearTextureCache === "function") try { PIXI.utils.clearTextureCache(); } catch (e) {}
        if (PIXI.utils && typeof PIXI.utils.destroyTextureCache === "function") try { PIXI.utils.destroyTextureCache(); } catch (e) {}
        // Hint to engine / GC (may not be available in all browsers)
        try { if (window.gc) window.gc(); } catch (e) { }
      } catch (e) { console.error('[Live2D] Texture cleanup failed', e); }
      // Pause sedikit agar UI terasa lebih halus saat load
      const isHeavyModel = path.toLowerCase().includes("huohuo");
      await new Promise(r => setTimeout(r, isHeavyModel ? 500 : 200));

      // Resume ticker sebelum load
      app.ticker.start();
      MODEL_PATH = path;

      // Reset retry counter on fresh load
      if (loadRetryCount > 0 && path.includes("?t=")) {
        // This is a retry â€” keep existing retry count
      } else {
        loadRetryCount = 0;
      }

      try {
        // Cache-bust so stale files don't block reload
        const loadPath = path + "?t=" + Date.now() + "_r" + loadRetryCount;

        // Adjust renderer & options for heavy vs light models
        if (isHeavyModel) {
          app.ticker.maxFPS = 18; // cap FPS for heavy models
        } else {
          app.ticker.maxFPS = 24;
        }

        const options = {
          autoInteract: true,
          autoUpdate: true,
          onError: (e) => console.error("[Live2D] Resource error:", e),
        };

        console.log("[Live2D] Loading from:", loadPath);
        model = await PIXI.live2d.Live2DModel.from(loadPath, options);

        // Scale to fit window height with padding; smaller scale for heavy models to save VRAM
        model.anchor.set(0.5, 1);
        const basePadding = 50;
        const scale = (app.screen.height - basePadding) / model.height * model.scale.x;
        model.scale.set(scale);
        model.x = app.screen.width / 2;
        model.y = app.screen.height;

        app.stage.addChild(model);

        // Hide watermark/credit text parts
        try {
          const core = model.internalModel.coreModel;
          const partIds = model.internalModel.coreModel._partIds || [];
          partIds.forEach((id, i) => {
            const lower = id.toLowerCase();
            if (lower.includes("illust") || lower.includes("text") ||
              lower.includes("credit") || lower.includes("watermark") ||
              lower.includes("logo") || lower.includes("copy"))
              core.setPartOpacityByIndex(i, 0);
          });
          // Juga hide via drawable jika ada
          const drawIds = core._drawableIds || [];
          drawIds.forEach((id, i) => {
            const lower = id.toLowerCase();
            if (lower.includes("illust") || lower.includes("text") ||
              lower.includes("credit") || lower.includes("watermark"))
              try { core.setDrawableOpacityByIndex(i, 0); } catch (e) { }
          });
        } catch (e) { }

        // Fade in
        canvas.style.opacity = "1";
        loading.style.display = "none";
        isModelLoaded = true;
        loadRetryCount = 0; // Reset retry on success

        // Notify WPF
        if (window.chrome && window.chrome.webview)
        {
          const loadTimeMs = (typeof loadStart !== 'undefined' && performance && performance.now) ? Math.round(performance.now() - loadStart) : null;
          let jsMem = null;
          try { if (performance && performance.memory) jsMem = performance.memory.usedJSHeapSize; } catch (e) { }
          window.chrome.webview.postMessage({ type: "model_loaded", heavy: isHeavyModel, loadTimeMs: loadTimeMs, jsMemoryUsed: jsMem });
        }

        model.on("pointerdown", onModelClick);
        model.interactive = true;
        model.cursor = "pointer";

        // Start idle motions immediately
        resetMotionFlags();
        startAutoMotion();
        setTimeout(() => { playIdleMotion(); playBodyMotion(); }, 500);

      } catch (err) {
        console.error("[Live2D] Load error:", err);
        
        // Notify WPF of error
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({ 
            type: "model_error", 
            error: err.message || "Unknown error",
            path: path
          });
        }
        
        // Retry logic: reload with delay
        if (loadRetryCount < MAX_RETRIES) {
          loadRetryCount++;
          console.log(`[Live2D] Retry ${loadRetryCount}/${MAX_RETRIES}...`);
          loading.querySelector(".text").textContent = `Retry ${loadRetryCount}/${MAX_RETRIES}...`;
          await new Promise(r => setTimeout(r, 1000));
          isLoadingModel = false; // Reset so loadModel can be called again
          await loadModel(path); // Retry
        } else {
          console.error("[Live2D] All retries exhausted");
          showError();
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({ 
              type: "model_error", 
              error: "All retries failed",
              path: path
            });
          }
          isLoadingModel = false;
        }
      } finally {
        // Only reset loading flag if not retrying
        if (loadRetryCount >= MAX_RETRIES || isModelLoaded) {
          isLoadingModel = false;
        }
      }
    }

    // â”€â”€ Auto-motion (idle loop) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function startAutoMotion() {
      stopAutoMotion();
      // Expression cycle: random interval 5â€“10 s
      autoMotionTimer = setInterval(() => {
        if (isModelLoaded) playIdleMotion();
      }, 5000 + Math.random() * 5000);

      // Body motion cycle: every 8â€“15 s (plays the motion3.json animations)
      idleMotionTimer = setInterval(() => {
        if (isModelLoaded) playBodyMotion();
      }, 8000 + Math.random() * 7000);
    }

    function stopAutoMotion() {
      if (autoMotionTimer) { clearInterval(autoMotionTimer); autoMotionTimer = null; }
      if (idleMotionTimer) { clearInterval(idleMotionTimer); idleMotionTimer = null; }
    }

    // â”€â”€ Play expression (face) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function playIdleMotion() {
      if (!model || !model.internalModel || isMotionPlaying) return;
      try {
        isMotionPlaying = true;
        const name = MODEL_PATH.toLowerCase();
        let expressions = [];

        if (name.includes("frieren")) {
          expressions = ["anya", "anya2", "yy", "ku", "han", "mmy", "d", "lks", "wh", "zx", "W", "erd"];
        } else if (name.includes("fern")) {
          expressions = ["lh", "sq", "sy"];
        } else if (name.includes("huohuo")) {
          expressions = ["angry", "baozhen", "cry", "qizi1", "qizi2", "white eyes"];
        } else if (name.includes("ç®€__1_")) {
          expressions = ["angry", "baozhen", "cry", "qizi1", "qizi2", "white eyes"];
        }

        if (expressions.length > 0) {
          const exp = expressions[Math.floor(Math.random() * expressions.length)];
          try { model.expression(exp); } catch (e) { }
        }
      } catch (e) { console.error("[Live2D] Expression error:", e); }
      finally { setTimeout(() => { isMotionPlaying = false; }, 2000); }
    }

    // â”€â”€ Play body motion (motion3.json) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function playBodyMotion() {
      if (!model || !model.internalModel || isBodyMotionPlaying) return;
      try {
        isBodyMotionPlaying = true;
        const name = MODEL_PATH.toLowerCase();
        const motionManager = model.internalModel.motionManager;
        if (!motionManager) return;

        if (name.includes("frieren")) {
          const idx = Math.floor(Math.random() * 2);
          model.motion("", idx);
        } else if (name.includes("fern")) {
          model.motion("", 0);
        } else if (name.includes("huohuo")) {
          const idx = Math.floor(Math.random() * 7);
          model.motion("", idx);
        }
      } catch (e) { /* motion may not be ready yet, ignore */ }
      finally { setTimeout(() => { isBodyMotionPlaying = false; }, 4000); }
    }

    // â”€â”€ Reset flags saat ganti model â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function resetMotionFlags() {
      isMotionPlaying = false;
      isBodyMotionPlaying = false;
    }

    // â”€â”€ Model click â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function onModelClick() {
      if (window.chrome && window.chrome.webview)
        window.chrome.webview.postMessage({ type: "click" });
      playIdleMotion();
      playBodyMotion();
    }

    // â”€â”€ changeModel (called from WPF) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function changeModel(path) {
      console.log("[Live2D] Changing model to:", path);
      await loadModel(path);
    }

    // â”€â”€ Eye tracking â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function updateEyeTracking(x, y) {
      targetEyeX = x;
      targetEyeY = y;
    }

    function updateLoop() {
      if (!isModelLoaded || !model || !model.internalModel) return;
      currentEyeX += (targetEyeX - currentEyeX) * 0.1;
      currentEyeY += (targetEyeY - currentEyeY) * 0.1;
      const core = model.internalModel.coreModel;
      if (!core) return;
      try {
        const params = {
          ParamEyeBallX: currentEyeX, ParamEyeBallY: currentEyeY,
          ParamAngleX: currentEyeX * 15, ParamAngleY: currentEyeY * 10,
          ParamBodyAngleX: currentEyeX * 5,
          ParamEyeBallX01: currentEyeX, ParamEyeBallY01: currentEyeY,
          ParamEyeX: currentEyeX, ParamEyeY: currentEyeY,
        };
        for (const [k, v] of Object.entries(params)) {
          const i = core.getParameterIndex(k);
          if (i >= 0) core.setParameterValueByIndex(i, v);
        }
      } catch (e) { }
    }

    // â”€â”€ Resize â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    window.addEventListener("resize", () => {
      if (app && model) {
        model.x = app.screen.width / 2;
        model.y = app.screen.height;
      }
    });

    // â”€â”€ Drag support â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let isDragging = false, startX, startY;
    window.addEventListener("mousedown", e => { isDragging = true; startX = e.screenX; startY = e.screenY; });
    window.addEventListener("mousemove", e => {
      if (!isDragging || !window.chrome?.webview) return;
      const dx = e.screenX - startX, dy = e.screenY - startY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
        window.chrome.webview.postMessage({ type: "drag", deltaX: dx, deltaY: dy });
        startX = e.screenX; startY = e.screenY;
      }
    });
    window.addEventListener("mouseup", () => { isDragging = false; });

    // â”€â”€ Error display â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showError() {
      const loading = document.getElementById("loading");
      loading.style.display = "block";
      loading.querySelector(".emoji").textContent = "ðŸ˜¢";
      loading.querySelector(".text").textContent = "Model tidak ditemukan atau rusak";
    }

    // â”€â”€ TTS / Lip-sync â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const synthesis = window.speechSynthesis;
    let availableVoices = [];

    // Load available voices
    function loadVoices() {
      availableVoices = synthesis.getVoices();
      console.log("[TTS] Available voices:", availableVoices.map(v => `${v.name} (${v.lang})`));
    }

    // Load voices on init and when they change
    if (synthesis.onvoiceschanged !== undefined) {
      synthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    // Voice mapping per character (prefer female voices)
    const characterVoices = {
      "Frieren": {
        // Prefer: Google Japanese Female, Microsoft Ayumi, or any Japanese female
        preferred: ["Google æ—¥æœ¬èªž", "Microsoft Ayumi", "ja-JP-Female"],
        lang: "ja-JP",
        pitch: 1.0,  // Cool, calm voice
        rate: 0.95   // Slightly slower
      },
      "Fern": {
        // Prefer: Microsoft Zira (English), Google US English Female
        preferred: ["Microsoft Zira", "Google US English", "en-US-Female"],
        lang: "en-US",
        pitch: 1.15, // Slightly higher, tsundere tone
        rate: 1.05   // Slightly faster
      },
      "Huohuo": {
        // Prefer: Google Chinese Female, Microsoft Huihui
        preferred: ["Google æ™®é€šè¯", "Microsoft Huihui", "zh-CN-Female"],
        lang: "zh-CN",
        pitch: 1.25, // Higher, playful voice
        rate: 1.1    // Faster, energetic
      }
    };

    function speakText(text, lang = "id-ID") {
      if (!synthesis) return;
      synthesis.cancel();

      const utt = new SpeechSynthesisUtterance(text);

      // Detect current character from MODEL_PATH
      let character = "Frieren"; // default
      if (MODEL_PATH.toLowerCase().includes("fern")) character = "Fern";
      else if (MODEL_PATH.toLowerCase().includes("huohuo")) character = "Huohuo";

      // Get character voice settings
      const voiceSettings = characterVoices[character] || characterVoices["Frieren"];
      
      // Try to find preferred voice
      let selectedVoice = null;
      for (const preferred of voiceSettings.preferred) {
        selectedVoice = availableVoices.find(v =>
          v.name.includes(preferred) ||
          (v.lang === voiceSettings.lang && v.name.toLowerCase().includes("female"))
        );
        if (selectedVoice) break;
      }

      // Fallback: any female voice in the language
      if (!selectedVoice) {
        selectedVoice = availableVoices.find(v =>
          v.lang.startsWith(voiceSettings.lang.split('-')[0]) &&
          (v.name.toLowerCase().includes("female") || v.name.toLowerCase().includes("woman"))
        );
      }

      // Fallback: any voice in the language
      if (!selectedVoice) {
        selectedVoice = availableVoices.find(v => v.lang.startsWith(voiceSettings.lang.split('-')[0]));
      }

      // Apply voice and settings
      if (selectedVoice) {
        utt.voice = selectedVoice;
        console.log(`[TTS] Using voice: ${selectedVoice.name} for ${character}`);
      } else {
        console.log(`[TTS] No suitable voice found for ${character}, using default`);
      }

      utt.lang = voiceSettings.lang;
      utt.rate = voiceSettings.rate;
      utt.pitch = voiceSettings.pitch;

      utt.onstart = () => {
        startLipSync();
        if (window.chrome?.webview) window.chrome.webview.postMessage({ type: "speech_start" });
      };
      utt.onend = () => {
        stopLipSync();
        if (window.chrome?.webview) window.chrome.webview.postMessage({ type: "speech_finished" });
      };

      synthesis.speak(utt);
    }

    function startLipSync() {
      if (mouthOpenTimer) clearInterval(mouthOpenTimer);
      mouthOpenTimer = setInterval(() => {
        if (!isModelLoaded || !model?.internalModel) return;
        const i = model.internalModel.coreModel.getParameterIndex("ParamMouthOpenY");
        if (i >= 0) model.internalModel.coreModel.setParameterValueByIndex(i, Math.random() * 0.8);
      }, 100);
    }

    function stopLipSync() {
      if (mouthOpenTimer) { clearInterval(mouthOpenTimer); mouthOpenTimer = null; }
      if (isModelLoaded && model?.internalModel) {
        const i = model.internalModel.coreModel.getParameterIndex("ParamMouthOpenY");
        if (i >= 0) model.internalModel.coreModel.setParameterValueByIndex(i, 0);
      }
    }

    // â”€â”€ STT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let recognition = null;
    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.continuous = false; recognition.interimResults = false; recognition.lang = "id-ID";
      recognition.onresult = e => {
        const text = e.results[0][0].transcript;
        if (window.chrome?.webview) window.chrome.webview.postMessage({ type: "speech_result", text });
      };
      recognition.onerror = e => { if (window.chrome?.webview) window.chrome.webview.postMessage({ type: "speech_error", error: e.error }); };
      recognition.onend = () => { if (window.chrome?.webview) window.chrome.webview.postMessage({ type: "speech_end" }); };
    }

    function startSpeech(lang = "id-ID") { if (recognition) { recognition.lang = lang; try { recognition.start(); } catch (e) { } } }
    function stopSpeech() { if (recognition) { try { recognition.stop(); } catch (e) { } } }

    // â”€â”€ WebMessage from WPF â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener("message", e => {
        try {
          const msg = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
          if (msg.type === "changeModel") changeModel(msg.path);
        } catch (err) { }
      });
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
